<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>භෞතික විද්‍යා සමීකරණ අත්පොත | SL A/L Physics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@300;400;600;700&family=Space+Mono:wght@400;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
:root {
  --bg: #0a0e1a;
  --surface: #111827;
  --surface2: #1a2235;
  --surface3: #1f2d44;
  --accent: #00d4ff;
  --accent2: #7c3aed;
  --accent3: #f59e0b;
  --gold: #fbbf24;
  --text: #e2e8f0;
  --text-muted: #94a3b8;
  --text-dim: #64748b;
  --success: #10b981;
  --danger: #ef4444;
  --border: rgba(0,212,255,0.15);
  --glow: rgba(0,212,255,0.08);
  --radius: 12px;
  --radius-sm: 8px;
  --font-si: 'Noto Sans Sinhala', sans-serif;
  --font-mono: 'Space Mono', monospace;
  --font-display: 'Playfair Display', serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-si);
  min-height: 100vh;
  line-height: 1.6;
  overflow-x: hidden;
}

/* ─── Background ─── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 20% -20%, rgba(0,212,255,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 110%, rgba(124,58,237,0.08) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

/* ─── Header ─── */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10,14,26,0.92);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
}

.header-inner {
  max-width: 900px;
  margin: 0 auto;
}

.header-top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
}

.logo-icon {
  width: 40px;
  height: 40px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}

.header-titles { flex: 1; }

.header-title {
  font-family: var(--font-display);
  font-size: clamp(16px, 4vw, 20px);
  font-weight: 900;
  background: linear-gradient(90deg, var(--accent), var(--gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.2;
}

.header-sub {
  font-size: 11px;
  color: var(--text-muted);
  font-family: var(--font-mono);
  letter-spacing: 1px;
}

/* ─── Search ─── */
.search-wrap {
  position: relative;
}

.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  font-size: 16px;
  pointer-events: none;
}

#searchInput {
  width: 100%;
  padding: 10px 12px 10px 38px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: var(--font-si);
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

#searchInput:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(0,212,255,0.1);
}

#searchInput::placeholder { color: var(--text-dim); }

/* ─── Stats Bar ─── */
.stats-bar {
  max-width: 900px;
  margin: 10px auto 0;
  padding: 0 16px;
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}

.stat-chip {
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--text-muted);
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 3px 10px;
  border-radius: 20px;
}

.stat-chip span { color: var(--accent); font-weight: 700; }

/* ─── Main ─── */
main {
  max-width: 900px;
  margin: 0 auto;
  padding: 16px;
  position: relative;
  z-index: 1;
}

/* ─── Chapter ─── */
.chapter {
  margin-bottom: 12px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface);
  overflow: hidden;
  transition: box-shadow 0.2s;
}

.chapter:hover { box-shadow: 0 4px 20px rgba(0,212,255,0.06); }

.chapter-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  cursor: pointer;
  user-select: none;
  transition: background 0.2s;
  -webkit-tap-highlight-color: transparent;
}

.chapter-header:hover { background: var(--glow); }

.chapter-num {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
  flex-shrink: 0;
}

.chapter-info { flex: 1; }

.chapter-name-si {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.3;
}

.chapter-name-en {
  font-size: 11px;
  color: var(--text-dim);
  font-family: var(--font-mono);
  margin-top: 1px;
}

.chapter-count {
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--text-dim);
  background: var(--surface2);
  padding: 2px 8px;
  border-radius: 10px;
}

.chapter-arrow {
  font-size: 14px;
  color: var(--text-dim);
  transition: transform 0.3s;
}

.chapter.open .chapter-arrow { transform: rotate(180deg); }

/* ─── Equations list ─── */
.equations-list {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s cubic-bezier(0.4,0,0.2,1);
}

.chapter.open .equations-list { max-height: 9999px; }

.equations-inner {
  padding: 0 12px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* ─── Equation Card ─── */
.eq-card {
  background: var(--surface2);
  border: 1px solid rgba(255,255,255,0.05);
  border-radius: var(--radius-sm);
  overflow: hidden;
  transition: border-color 0.2s;
}

.eq-card:hover { border-color: rgba(0,212,255,0.2); }

.eq-card.hidden { display: none; }

.eq-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.eq-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  flex: 1;
}

.eq-toggle-icon {
  font-size: 12px;
  color: var(--text-dim);
  margin-left: 8px;
  transition: transform 0.2s;
}

.eq-card.expanded .eq-toggle-icon { transform: rotate(180deg); }

.eq-body {
  display: none;
  padding: 0 12px 12px;
}

.eq-card.expanded .eq-body { display: block; }

/* ─── Formula Display ─── */
.formula-box {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px;
  margin-bottom: 10px;
  text-align: center;
  overflow-x: auto;
}

.formula-box .katex { font-size: 1.3em; }

/* ─── Derivation ─── */
.derivation {
  background: rgba(251,191,36,0.04);
  border-left: 3px solid var(--gold);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  padding: 10px 12px;
  margin-bottom: 10px;
}

.derivation-label {
  font-size: 10px;
  font-family: var(--font-mono);
  color: var(--gold);
  letter-spacing: 1px;
  margin-bottom: 4px;
  text-transform: uppercase;
}

.derivation-text {
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.7;
}

/* ─── Variables ─── */
.vars-section { margin-bottom: 10px; }

.vars-label {
  font-size: 10px;
  font-family: var(--font-mono);
  color: var(--text-dim);
  letter-spacing: 1px;
  margin-bottom: 6px;
  text-transform: uppercase;
}

.vars-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.var-chip {
  background: var(--surface3);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 6px;
  padding: 3px 8px;
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--text-muted);
}

.var-chip .var-sym { color: var(--accent); }

/* ─── Calculator ─── */
.calc-section {
  background: rgba(124,58,237,0.06);
  border: 1px solid rgba(124,58,237,0.2);
  border-radius: var(--radius-sm);
  padding: 10px;
}

.calc-label {
  font-size: 10px;
  font-family: var(--font-mono);
  color: var(--accent2);
  letter-spacing: 1px;
  margin-bottom: 8px;
  text-transform: uppercase;
}

.calc-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 6px;
  margin-bottom: 8px;
}

.calc-input-wrap { display: flex; flex-direction: column; gap: 3px; }

.calc-input-label {
  font-size: 10px;
  font-family: var(--font-mono);
  color: var(--text-dim);
}

.calc-input {
  padding: 7px 10px;
  background: var(--bg);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 6px;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 13px;
  outline: none;
  width: 100%;
  transition: border-color 0.2s;
}

.calc-input:focus { border-color: var(--accent2); }

.calc-solve-btn {
  width: 100%;
  padding: 9px;
  background: linear-gradient(135deg, var(--accent2), #6d28d9);
  border: none;
  border-radius: 6px;
  color: white;
  font-family: var(--font-si);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
  -webkit-tap-highlight-color: transparent;
}

.calc-solve-btn:active { transform: scale(0.97); opacity: 0.9; }

.calc-result {
  margin-top: 8px;
  padding: 8px 10px;
  background: var(--surface3);
  border-radius: 6px;
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--success);
  display: none;
}

.calc-result.show { display: block; }
.calc-result.error { color: var(--danger); }

/* ─── No results ─── */
#noResults {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-dim);
  display: none;
}

#noResults.show { display: block; }

/* ─── Footer ─── */
.footer {
  text-align: center;
  padding: 30px 16px;
  color: var(--text-dim);
  font-size: 11px;
  font-family: var(--font-mono);
  position: relative;
  z-index: 1;
}

/* ─── Chapter colors ─── */
.c0 { background: linear-gradient(135deg,#00d4ff,#0099cc); color:#000; }
.c1 { background: linear-gradient(135deg,#f59e0b,#d97706); color:#000; }
.c2 { background: linear-gradient(135deg,#10b981,#059669); color:#000; }
.c3 { background: linear-gradient(135deg,#ef4444,#dc2626); color:#000000; }
.c4 { background: linear-gradient(135deg,#8b5cf6,#7c3aed); color:#000000; }
.c5 { background: linear-gradient(135deg,#06b6d4,#0891b2); color:#000; }
.c6 { background: linear-gradient(135deg,#f97316,#ea580c); color:#000; }
.c7 { background: linear-gradient(135deg,#84cc16,#65a30d); color:#000; }
.c8 { background: linear-gradient(135deg,#ec4899,#db2777); color:#000000; }
.c9 { background: linear-gradient(135deg,#a855f7,#9333ea); color:#000000; }
.c10 { background: linear-gradient(135deg,#14b8a6,#0d9488); color:#000; }
.c11 { background: linear-gradient(135deg,#fffb00,#f1e203); color:#000; }
/* ─── Scrollbar ─── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ─── Responsive ─── */
@media (min-width: 600px) {
  .header-inner { display: flex; align-items: center; gap: 12px; margin-bottom: 0; }
  .header-top { margin-bottom: 0; }
  .search-wrap { flex: 1; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="header-top">
      <div class="logo-icon">⚛️ </div>
      <div class="header-titles">
        <div class="header-title">භෞතික විද්‍යා සමීකරණ</div>
        <div class="header-sub">SL A/L PHYSICS · EQUATION by vivan(25/26) </div>
      </div>

</header>

<div class="stats-bar">

</div>

<main id="main">
  <div id="noResults">

  </div>
</main>

<footer class="footer">
  ශ්‍රී ලංකා උසස් පෙළ භෞතික විද්‍යා · SL A/L Physics Equation Handbook<br>

// ═══════════════════════════════════════════════════════════════
//  RENDER ENGINE
// ═══════════════════════════════════════════════════════════════
function renderKaTeX(str) {
  try {
    return katex.renderToString(str, { throwOnError: false, displayMode: false });
  } catch(e) { return str; }
}

function buildCalcHTML(calc, eqId) {
  if (!calc) return '';
  const inputs = calc.inputs.map(inp => `
    <div class="calc-input-wrap">
      <label class="calc-input-label">${inp.label}</label>
      <input class="calc-input" type="number" id="ci_${eqId}_${inp.id}" placeholder="${inp.placeholder||'0'}" step="any">
    </div>`).join('');
  return `
    <div class="calc-section">
      <div class="calc-label">🔢 ${calc.label}</div>
      <div class="calc-grid">${inputs}</div>
      <button class="calc-solve-btn" onclick="solveEq('${eqId}')">= ගණනය කරන්න</button>
      <div class="calc-result" id="cr_${eqId}"></div>
    </div>`;
}

function buildVarsHTML(vars) {
  if (!vars || !vars.length) return '';
  const chips = vars.map(v => `<div class="var-chip"><span class="var-sym">${v.s}</span> — ${v.d}</div>`).join('');
  return `<div class="vars-section"><div class="vars-label">සංකේත</div><div class="vars-grid">${chips}</div></div>`;
}

function buildEquationCard(eq, eqId) {
  const calcData = eq.calc ? JSON.stringify(eq.calc).replace(/'/g,"&apos;") : '';
  return `
  <div class="eq-card" id="${eqId}" data-name="${eq.name.toLowerCase()}">
    <div class="eq-header" onclick="toggleEq('${eqId}')">
      <div class="eq-name">${eq.name}</div>
      <span class="eq-toggle-icon">▼</span>
    </div>
    <div class="eq-body">
      <div class="formula-box">${renderKaTeX(eq.formula)}</div>
      <div class="derivation">
        <div class="derivation-label">📐 ලබාගන්නා ආකාරය</div>
        <div class="derivation-text">${eq.derivation}</div>
      </div>
      ${buildVarsHTML(eq.vars)}
      ${eq.calc ? buildCalcHTML(eq.calc, eqId) : ''}
    </div>
  </div>`;
}

function buildChapterHTML(ch, ci) {
  const eqs = ch.equations.map((eq,ei) => buildEquationCard(eq, `eq_${ci}_${ei}`)).join('');
  return `
  <div class="chapter" id="ch_${ci}">
    <div class="chapter-header" onclick="toggleChapter(${ci})">
      <div class="chapter-num c${ci}">${String(ci+1).padStart(2,'0')}</div>
      <div class="chapter-info">
        <div class="chapter-name-si">${ch.si}</div>
        <div class="chapter-name-en">${ch.en}</div>
      </div>
      <div class="chapter-count">${ch.equations.length} eq</div>
      <span class="chapter-arrow">▼</span>
    </div>
    <div class="equations-list">
      <div class="equations-inner">${eqs}</div>
    </div>
  </div>`;
}

// Build DOM
const main = document.getElementById('main');
const noResults = document.getElementById('noResults');
let totalEqs = 0;

CHAPTERS.forEach((ch, ci) => {
  totalEqs += ch.equations.length;
  main.insertAdjacentHTML('beforeend', buildChapterHTML(ch, ci));
});

document.getElementById('chapterCount').textContent = CHAPTERS.length;
document.getElementById('eqCount').textContent = totalEqs;

// ═══════════════════════════════════════════════════════════════
//  INTERACTIONS
// ═══════════════════════════════════════════════════════════════
function toggleChapter(ci) {
  const ch = document.getElementById(`ch_${ci}`);
  ch.classList.toggle('open');
}

function toggleEq(eqId) {
  const card = document.getElementById(eqId);
  card.classList.toggle('expanded');
}

// Calculator solver
const calcStore = {};
CHAPTERS.forEach((ch,ci) => {
  ch.equations.forEach((eq,ei) => {
    if (eq.calc) calcStore[`eq_${ci}_${ei}`] = eq.calc;
  });
});

function solveEq(eqId) {
  const calc = calcStore[eqId];
  if (!calc) return;
  const res = document.getElementById(`cr_${eqId}`);
  try {
    const vals = {};
    for (const inp of calc.inputs) {
      vals[inp.id] = document.getElementById(`ci_${eqId}_${inp.id}`).value;
    }
    // Build evaluation context
    const ctx = Object.entries(vals).map(([k,v]) => `const ${k}="${v}";`).join('');
    const result = eval(ctx + '(' + calc.formula + ')');
    if (isNaN(result) || !isFinite(result)) throw new Error("Invalid input");
    const formatted = Math.abs(result) < 0.001 || Math.abs(result) > 1e6
      ? result.toExponential(4)
      : parseFloat(result.toFixed(6));
    res.textContent = `${calc.resultLabel} = ${formatted} ${calc.unit}`;
    res.className = 'calc-result show';
  } catch(e) {
    res.textContent = '⚠ ඇතුළු කළ අගයන් නිවැරදි නොවේ';
    res.className = 'calc-result show error';
  }
}

// ═══════════════════════════════════════════════════════════════
//  SEARCH
// ═══════════════════════════════════════════════════════════════
document.getElementById('searchInput').addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  const stat = document.getElementById('searchStat');
  const countEl = document.getElementById('searchCount');
  let visible = 0;
  let anyChapterVisible = false;

  CHAPTERS.forEach((ch, ci) => {
    const chEl = document.getElementById(`ch_${ci}`);
    let chapterHasMatch = false;

    ch.equations.forEach((eq, ei) => {
      const card = document.getElementById(`eq_${ci}_${ei}`);
      const matches = !q ||
        eq.name.toLowerCase().includes(q) ||
        ch.si.toLowerCase().includes(q) ||
        ch.en.toLowerCase().includes(q) ||
        eq.derivation.toLowerCase().includes(q);

      card.classList.toggle('hidden', !matches);
      if (matches) { chapterHasMatch = true; visible++; }
    });

    chEl.style.display = chapterHasMatch ? '' : 'none';
    if (chapterHasMatch) {
      anyChapterVisible = true;
      if (q) chEl.classList.add('open');
    }
  });

  noResults.classList.toggle('show', !anyChapterVisible);
  if (q) {
    stat.style.display = '';
    countEl.textContent = visible;
  } else {
    stat.style.display = 'none';
  }
});

// Open first chapter by default
document.getElementById('ch_0').classList.add('close');
</script>
