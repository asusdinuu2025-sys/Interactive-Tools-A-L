<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>යාන්ත්‍ර විද්‍යාව — Mechanics Sci-LiNK</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#0E1B2E;
  --ink2:#16273F;
  --paper:#F5F1E8;
  --paper2:#EDE6D6;
  --amber:#F2A93B;
  --amber-deep:#C9821E;
  --teal:#2FA6A6;
  --line:#D8CFB8;
  --line-dark:#25384F;
  --text:#182233;
  --text-soft:#4B5A70;
  --card:#FFFFFF;
  --sim:#E1556B;
  --shadow: 0 1px 2px rgba(20,20,10,.06), 0 6px 20px rgba(20,20,10,.06);
  --radius: 14px;
  --maxw: 880px;
}
[data-theme="dark"]{
  --paper:#0E1729;
  --paper2:#0A1220;
  --text:#EAE6D9;
  --text-soft:#9FAEC2;
  --card:#132038;
  --line:#25384F;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--text);
  font-family:'Noto Sans Sinhala','Space Grotesk',sans-serif;
  transition:background .3s ease, color .3s ease;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.code-mono{font-family:'JetBrains Mono',monospace;}

/* ===== Header ===== */
header.top{
  position:sticky; top:0; z-index:50;
  background:var(--paper);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(6px);
}
.top-inner{
  max-width:var(--maxw); margin:0 auto; padding:14px 16px 10px;
}
.brand{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.brand-title{
  display:flex; flex-direction:column; line-height:1.05;
}
.brand-title .eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--amber-deep);
  font-weight:700;
}
.brand-title h1{
  font-family:'Space Grotesk',sans-serif;
  font-size:21px; margin:2px 0 0; font-weight:700; letter-spacing:-.01em;
  color:var(--text);
}
.brand-title h1 span{color:var(--amber-deep);}

.icon-btns{display:flex; gap:8px;}
.icon-btn{
  width:38px;height:38px; border-radius:10px; border:1px solid var(--line);
  background:var(--card); color:var(--text); font-size:16px;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  transition:transform .15s ease, background .2s;
}
.icon-btn:hover{transform:translateY(-1px);}
.icon-btn.active{ background:var(--amber); border-color:var(--amber-deep); color:#241505;}

.searchwrap{
  margin-top:12px; position:relative;
}
.searchwrap input{
  width:100%; padding:11px 14px 11px 38px; border-radius:11px;
  border:1px solid var(--line); background:var(--card); color:var(--text);
  font-size:14.5px; font-family:inherit; outline:none;
}
.searchwrap input:focus{border-color:var(--amber-deep);}
.searchwrap svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.55;}

.tabs{
  display:flex; gap:6px; overflow-x:auto; margin-top:12px; padding-bottom:10px;
  scrollbar-width:thin;
}
.tabs::-webkit-scrollbar{height:5px;}
.tabs::-webkit-scrollbar-thumb{background:var(--line); border-radius:10px;}
.tab-btn{
  flex:0 0 auto;
  padding:8px 13px; border-radius:999px; border:1px solid var(--line);
  background:var(--card); color:var(--text-soft); font-size:13px; font-weight:600;
  cursor:pointer; white-space:nowrap; font-family:'Noto Sans Sinhala',sans-serif;
  transition:all .15s ease;
}
.tab-btn .num{font-family:'JetBrains Mono',monospace; font-size:10.5px; opacity:.6; margin-right:5px;}
.tab-btn.active{
  background:var(--ink); color:var(--paper); border-color:var(--ink);
}
[data-theme="dark"] .tab-btn.active{ background:var(--amber); color:#241505; border-color:var(--amber);}
.tab-btn.calc.active{background:var(--teal); border-color:var(--teal); color:#04231f;}

/* ===== Layout ===== */
main{max-width:var(--maxw); margin:0 auto; padding:18px 16px 80px;}

.chapter-head{
  display:flex; align-items:baseline; gap:10px; margin:6px 0 16px;
}
.chapter-head .chnum{
  font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--amber-deep); font-weight:700;
}
.chapter-head h2{
  font-family:'Space Grotesk',sans-serif; font-size:22px; margin:0; font-weight:700;
}
.chapter-head .en{
  font-size:12.5px; color:var(--text-soft); font-style:italic;
}

.revision-banner{
  display:flex; align-items:center; justify-content:space-between;
  background:linear-gradient(120deg, var(--amber) 0%, var(--teal) 130%);
  color:#1c1206; border-radius:12px; padding:10px 14px; margin-bottom:16px;
  font-size:13px; font-weight:600;
}
.revision-banner button{
  background:#1c1206; color:#fff; border:none; padding:6px 12px; border-radius:8px;
  font-size:12px; cursor:pointer; font-weight:700;
}

.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px 16px 15px; margin-bottom:12px; box-shadow:var(--shadow);
  position:relative; overflow:hidden;
}
.card::before{
  content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
  background:var(--accent, var(--amber));
}
.card-top{display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap;}
.badge{
  font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700;
  background:var(--paper2); color:var(--accent, var(--amber-deep));
  padding:3px 8px; border-radius:6px; border:1px solid var(--line);
}
.card h3{
  font-size:15.5px; margin:0; font-weight:700; line-height:1.35; flex:1;
}
.card p.note{
  font-size:13.5px; color:var(--text-soft); margin:6px 0 8px; line-height:1.55;
}
.formula-box{
  background:var(--paper2); border-radius:10px; padding:10px 12px; margin-top:6px;
  font-size:14.5px; overflow-x:auto;
  transition:filter .2s ease, opacity .2s ease;
}
.formula-box.katex-display{margin:0;}
.hide-toggle{
  display:none; align-items:center; gap:6px; font-size:12px; font-weight:700;
  color:var(--text-soft); background:none; border:1px dashed var(--line);
  padding:5px 10px; border-radius:8px; cursor:pointer; margin-top:8px;
}
body.revision-mode .hide-toggle{display:inline-flex;}
body.revision-mode .formula-box{ filter:blur(7px); opacity:.5; user-select:none; cursor:pointer;}
body.revision-mode .card.revealed .formula-box{filter:none; opacity:1;}

.hidden{display:none !important;}
.empty-state{
  text-align:center; padding:50px 20px; color:var(--text-soft); font-size:14px;
}

/* ===== Calculators ===== */
.calc-card{
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:18px; margin-bottom:18px; box-shadow:var(--shadow);
}
.calc-card h3{
  font-family:'Space Grotesk',sans-serif; font-size:17px; margin:0 0 4px;
  display:flex; align-items:center; gap:8px;
}
.calc-card .sub{font-size:12.5px; color:var(--text-soft); margin-bottom:14px;}
.field-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
.field{flex:1; min-width:110px;}
.field label{
  display:block; font-size:11.5px; color:var(--text-soft); margin-bottom:4px; font-weight:600;
}
.field input, .field select{
  width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--line);
  background:var(--paper2); color:var(--text); font-size:14px; font-family:'JetBrains Mono',monospace;
}
.calc-btn{
  background:var(--ink); color:var(--paper); border:none; padding:10px 18px;
  border-radius:9px; font-weight:700; font-size:13.5px; cursor:pointer; margin-top:4px;
  font-family:'Noto Sans Sinhala',sans-serif;
}
[data-theme="dark"] .calc-btn{background:var(--amber); color:#241505;}
.result-box{
  margin-top:14px; background:var(--paper2); border-radius:10px; padding:12px 14px;
  font-size:14.5px; min-height:20px; border-left:4px solid var(--teal);
}
.result-box.empty{color:var(--text-soft); font-size:13px;}

footer.foot{
  text-align:center; padding:20px; font-size:12px; color:var(--text-soft);
}

/* ===== Simulations ===== */
.tab-btn.sim.active{background:var(--sim,#E1556B); border-color:var(--sim,#E1556B); color:#2a0510;}
.sim-canvas-wrap{
  background:var(--paper2); border-radius:12px; padding:6px; margin-bottom:12px;
  border:1px solid var(--line); overflow:hidden;
}
.sim-canvas-wrap canvas{ width:100%; height:auto; display:block; border-radius:8px; background:transparent; }
.sim-controls{display:flex; gap:8px; margin:10px 0; flex-wrap:wrap;}
.sim-btn{
  background:var(--ink); color:var(--paper); border:none; padding:9px 16px; border-radius:9px;
  font-weight:700; font-size:13px; cursor:pointer; font-family:'Noto Sans Sinhala',sans-serif;
}
[data-theme="dark"] .sim-btn{background:var(--sim,#E1556B); color:#2a0510;}
.sim-btn.secondary{background:transparent; border:1px solid var(--line); color:var(--text);}
.readout{
  display:flex; flex-wrap:wrap; gap:10px 18px; font-family:'JetBrains Mono',monospace;
  font-size:12.5px; background:var(--paper2); border-radius:10px; padding:9px 12px; margin-top:8px;
}
.readout b{color:var(--sim,#E1556B);}
.bar-meter-row{display:flex; align-items:center; gap:8px; margin-top:6px; font-size:12px;}
.bar-meter-row .lbl{width:34px; font-weight:700; font-family:'JetBrains Mono',monospace;}
.bar-meter{flex:1; height:14px; border-radius:7px; background:var(--line); overflow:hidden;}
.bar-fill{height:100%; border-radius:7px; transition:width .05s linear;}
.status-pill{
  display:inline-block; font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:999px;
  background:var(--paper2); border:1px solid var(--line); margin-bottom:6px;
}
.status-pill.warn{background:#F2A93B; color:#241505; border-color:#C9821E;}
.status-pill.ok{background:#2FA6A6; color:#04231f; border-color:#1B9C85;}

@media(min-width:640px){
  .brand-title h1{font-size:24px;}
  .card h3{font-size:16.5px;}
}
</style>
</head>

const chapters = [

  {code:'M/V01', title:'දෛශික රාශියක මූලික ලක්ෂණ', note:'විශාලත්වයක්, දිශාවක්, ක්‍රියා ලක්ෂ්‍යක් පවතී.'},

  {code:'M/V06', title:'ආනත දෛශික 02ක අන්තරය (Triangle Law)', tex:'D=\\sqrt{P^2+Q^2-2PQ\\cos\\theta}\\qquad \\beta=\\tan^{-1}\\!\\left(\\dfrac{Q\\sin\\theta}{P-Q\\cos\\theta}\\right)'},

  {code:'M/V09', title:'v2ක R හි පිහිටීම', note:'එකම/ආනත දිශාවේ: P=Q නම් (P,Q අතර) මැදින්; P≤Q නම් විශාලයට ආසන්නව. විරුද්ධ දිශාවේ: P=Q නම් R=0; P≠Q නම් විශාලයට ආසන්නව, පිටතින්.'},
  {code:'M/V10', title:'දෛශික 03ක් R=0 වීමට', note:'සමාන්තර නම්: c=a+b (විශාලත්ව පමණි). ආනත/කෝණික නම් (ත්‍රිකෝණයක් සෑදිය හැක): a+b≥c.'},
  {code:'M/V11', title:'දෛශික දෙකක සම්පුෂ්ජ/අන්තර සීමා', tex:'|P-Q|\\le R \\le |P+Q| \\qquad |P-Q|\\le D \\le |P+Q|'},
  {code:'M/V12', title:'ආනත දෛශික 02ක විශේෂ අවස්ථාව — θ=90°', tex:'R=D=\\sqrt{P^2+Q^2}\\qquad \\alpha=\\beta=\\tan^{-1}\\!\\left(\\dfrac{Q}{P}\\right)', note:'P⊥Q විට.'},

  {code:'M/V14', title:'θ, R, D වගුව (P=Q=F විට)', note:'θ=0°→R=2F,D=0 | θ=60°→R=√3F,D=F | θ=90°→R=√2F,D=√2F | θ=120°→R=F,D=√3F | θ=180°→R=0,D=2F'},

{id:'motion', num:'02', accent:'#2FA6A6', si:'චලිතය', en:'Motion', items:[

  {code:'M/L04', title:'සාමාන්‍ය ප්‍රවේගය (දෛශික)', tex:'\\vec{V_a}=\\dfrac{\\varepsilon S}{t}=\\dfrac{(u+V)}{2}'},

/* ===================== CALCULATORS ===================== */
const calcTab = {id:'calculators', num:'✦', si:'ගණකාරක', en:'Calculators'};

/* ===================== RENDER ===================== */
const tabBar = document.getElementById('tabBar');
const mainArea = document.getElementById('mainArea');
let activeTab = chapters[0].id;
let searchTerm = '';

function buildTabs(){
  tabBar.innerHTML = '';
  chapters.forEach(ch=>{
    const b = document.createElement('button');
    b.className = 'tab-btn' + (ch.id===activeTab? ' active':'');
    b.innerHTML = `<span class="num">${ch.num}</span>${ch.si}`;
    b.onclick = ()=>{ activeTab = ch.id; render(); };
    tabBar.appendChild(b);
  });
  const cb = document.createElement('button');
  cb.className = 'tab-btn calc' + (activeTab==='calculators'? ' active':'');
  cb.innerHTML = `<span class="num">✦</span>ගණකාරක`;
  cb.onclick = ()=>{ activeTab='calculators'; render(); };
  tabBar.appendChild(cb);

  const sb = document.createElement('button');
  sb.className = 'tab-btn sim' + (activeTab==='simulations'? ' active':'');
  sb.innerHTML = `<span class="num">🧪</span>සිමියුලේෂන්`;
  sb.onclick = ()=>{ activeTab='simulations'; render(); };
  tabBar.appendChild(sb);
}

function matches(item, ch, term){
  if(!term) return true;
  const hay = (item.code+' '+item.title+' '+(item.note||'')+' '+(item.tex||'')+' '+ch.si+' '+ch.en).toLowerCase();
  return hay.includes(term.toLowerCase());
}

function renderChapter(ch){
  const wrap = document.createElement('div');
  const revisionBanner = document.createElement('div');
  if(document.body.classList.contains('revision-mode')){
    revisionBanner.className = 'revision-banner';
    revisionBanner.innerHTML = `<span>🎯 MCQ Revision — සූත්‍රය මත click කර පෙන්වන්න</span>`;
    wrap.appendChild(revisionBanner);
  }

  const head = document.createElement('div');
  head.className = 'chapter-head';
  head.innerHTML = `<span class="chnum">${ch.num}</span><h2>${ch.si}</h2><span class="en">${ch.en}</span>`;
  wrap.appendChild(head);

  const filtered = ch.items.filter(it=>matches(it, ch, searchTerm));
  if(filtered.length===0){
    const e = document.createElement('div');
    e.className='empty-state';
    e.textContent = 'මෙම පරිච්ඡේදයේ ගැළපෙන ප්‍රතිඵල නොමැත.';
    wrap.appendChild(e);
  }

  filtered.forEach((it,idx)=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.style.setProperty('--accent', ch.accent);
    let inner = `<div class="card-top"><span class="badge">${it.code}</span><h3>${it.title}</h3></div>`;
    if(it.note) inner += `<p class="note">${it.note}</p>`;
    if(it.tex) inner += `<div class="formula-box tex">\\[${it.tex}\\]</div>`;
    if(it.tex) inner += `<button class="hide-toggle">👁 පෙන්වන්න / සඟවන්න</button>`;
    card.innerHTML = inner;
    if(it.tex){
      card.addEventListener('click', (e)=>{
        if(document.body.classList.contains('revision-mode')){
          card.classList.toggle('revealed');
        }
      });
    }
    wrap.appendChild(card);
  });

  return wrap;
}

function attachCalcListeners(){
  const vBtn = document.getElementById('vcalcBtn');
  if(vBtn) vBtn.onclick = ()=>{
    const P=parseFloat(document.getElementById('vp').value)||0;
    const Q=parseFloat(document.getElementById('vq').value)||0;
    const th=(parseFloat(document.getElementById('vtheta').value)||0)*Math.PI/180;
    const R=Math.sqrt(P*P+Q*Q+2*P*Q*Math.cos(th));
    const alpha = Math.atan2(Q*Math.sin(th), P+Q*Math.cos(th))*180/Math.PI;
    const box=document.getElementById('vresult');
    box.classList.remove('empty');
    box.innerHTML = `<b>R = ${R.toFixed(3)}</b> &nbsp; | &nbsp; α (P සිට) = ${alpha.toFixed(2)}°`;
  };

  const fBtn = document.getElementById('fcalcBtn');
  if(fBtn) fBtn.onclick = ()=>{
    const mu=parseFloat(document.getElementById('fmu').value)||0;
    const m=parseFloat(document.getElementById('fm').value)||0;
    const g=parseFloat(document.getElementById('fg').value)||9.8;
    const R=m*g;
    const F=mu*R;
    const box=document.getElementById('fresult');
    box.classList.remove('empty');
    box.innerHTML = `සාමාන්‍ය ප්‍රතික්‍රියාව R = mg = <b>${R.toFixed(2)} N</b><br>සීමාකාරී ඝර්ෂණය F = μR = <b>${F.toFixed(2)} N</b>`;
  };

  const pBtn = document.getElementById('pcalcBtn');
  if(pBtn) pBtn.onclick = ()=>{
    const u=parseFloat(document.getElementById('pu').value)||0;
    const th=(parseFloat(document.getElementById('ptheta').value)||0)*Math.PI/180;
    const g=parseFloat(document.getElementById('pg').value)||9.8;
    const hmax = (u*u*Math.sin(th)*Math.sin(th))/(2*g);
    const R = (u*u*Math.sin(2*th))/g;
    const T = (2*u*Math.sin(th))/g;
    const box=document.getElementById('presult');
    box.classList.remove('empty');
    box.innerHTML = `h_max = <b>${hmax.toFixed(2)} m</b> &nbsp;|&nbsp; Range R = <b>${R.toFixed(2)} m</b> &nbsp;|&nbsp; Time of flight T = <b>${T.toFixed(2)} s</b>`;
  };

  const sBtn = document.getElementById('scalcBtn');
  if(sBtn) sBtn.onclick = ()=>{
    let u=document.getElementById('su').value, v=document.getElementById('sv').value,
        a=document.getElementById('sa').value, t=document.getElementById('st').value;
    u=u===''?null:parseFloat(u); v=v===''?null:parseFloat(v);
    a=a===''?null:parseFloat(a); t=t===''?null:parseFloat(t);
    const box=document.getElementById('sresult');
    box.classList.remove('empty');
    const known=[u,v,a,t].filter(x=>x!==null).length;
    if(known<3){ box.innerHTML='අවම වශයෙන් අගයන් 3ක් යොදන්න.'; return; }
    // solve missing value
    if(u===null && v!==null && a!==null && t!==null) u = v - a*t;
    else if(v===null && u!==null && a!==null && t!==null) v = u + a*t;
    else if(a===null && u!==null && v!==null && t!==null) a = (v-u)/t;
    else if(t===null && u!==null && v!==null && a!==null) t = (v-u)/a;
    const s = (u!==null && v!==null && t!==null) ? ((u+v)/2)*t : null;
    box.innerHTML = `u=<b>${u!==null?u.toFixed(2):'-'}</b>, v=<b>${v!==null?v.toFixed(2):'-'}</b>, a=<b>${a!==null?a.toFixed(2):'-'}</b>, t=<b>${t!==null?t.toFixed(2):'-'}</b>` + (s!==null? ` &nbsp;|&nbsp; s = <b>${s.toFixed(2)} m</b>`:'');
  };
}

/* ---- 1. Projectile ---- */
function initProjectileSim(){
  const canvas = document.getElementById('simProjCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height, groundY = H - 30;
  let running=false, t=0, trail=[];

  function paramsAndCompute(){
    const u = parseFloat(document.getElementById('simPu').value)||20;
    const thetaDeg = parseFloat(document.getElementById('simPtheta').value)||45;
    const g = parseFloat(document.getElementById('simPg').value)||9.8;
    const theta = thetaDeg*Math.PI/180;
    const T = (2*u*Math.sin(theta))/g;
    const R = (u*u*Math.sin(2*theta))/g;
    const hmax = (u*u*Math.sin(theta)*Math.sin(theta))/(2*g);
    const px = Math.max(3, Math.min(18, (W-60)/Math.max(R,1)));
    return {u,theta,g,T,R,hmax,px};
  }

  function draw(p){
    ctx.clearRect(0,0,W,H);
    // ground
    ctx.strokeStyle = getCss('--line'); ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,groundY); ctx.lineTo(W,groundY); ctx.stroke();
    // launch point
    const x0=30;
    // trajectory guide (dashed max height / range)
    ctx.strokeStyle='rgba(150,150,150,.35)'; ctx.setLineDash([4,4]);
    const hmaxPx = groundY - p.hmax*p.px;
    ctx.beginPath(); ctx.moveTo(0,hmaxPx); ctx.lineTo(W,hmaxPx); ctx.stroke();
    ctx.setLineDash([]);
    // trail
    ctx.strokeStyle = getCss('--sim') || '#E1556B'; ctx.lineWidth=2;
    ctx.beginPath();
    trail.forEach((pt,i)=>{ i===0? ctx.moveTo(pt.x,pt.y): ctx.lineTo(pt.x,pt.y); });
    ctx.stroke();
    // ball
    if(trail.length){
      const last = trail[trail.length-1];
      ctx.fillStyle = getCss('--sim') || '#E1556B';
      ctx.beginPath(); ctx.arc(last.x,last.y,7,0,Math.PI*2); ctx.fill();
    }
  }

  function reset(){
    running=false; t=0; trail=[];
    const p = paramsAndCompute();
    draw(p);
    document.getElementById('simProjReadout').innerHTML =
      `t=<b>0.00</b>s &nbsp; h_max=<b>${p.hmax.toFixed(2)}</b>m &nbsp; R=<b>${p.R.toFixed(2)}</b>m &nbsp; T=<b>${p.T.toFixed(2)}</b>s`;
  }

  function step(){
    const p = paramsAndCompute();
    if(t> p.T){ running=false; return; }
    const x = p.u*Math.cos(p.theta)*t;
    const y = p.u*Math.sin(p.theta)*t - 0.5*p.g*t*t;
    const cx = 30 + x*p.px, cy = groundY - Math.max(y,0)*p.px;
    trail.push({x:cx,y:cy});
    draw(p);
    document.getElementById('simProjReadout').innerHTML =
      `t=<b>${t.toFixed(2)}</b>s &nbsp; x=<b>${x.toFixed(2)}</b>m &nbsp; y=<b>${Math.max(y,0).toFixed(2)}</b>m &nbsp; h_max=<b>${p.hmax.toFixed(2)}</b>m &nbsp; R=<b>${p.R.toFixed(2)}</b>m`;
    t += 0.035;
    if(running){ const id = requestAnimationFrame(step); simAnimFrames.push(id); }
  }

  document.getElementById('simProjPlay').onclick = ()=>{
    if(running) return;
    if(t===0) trail=[];
    running=true; step();
  };
  document.getElementById('simProjReset').onclick = reset;
  reset();
}

/* ---- 2. Incline + Friction ---- */
function initInclineSim(){
  const canvas = document.getElementById('simIncCanvas');
  const ctx = canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  let running=false, t=0;

  function compute(){
    const thetaDeg = parseFloat(document.getElementById('simIncTheta').value)||30;
    const mu = parseFloat(document.getElementById('simIncMu').value)||0.25;
    const theta = thetaDeg*Math.PI/180;
    const g=9.8;
    const willMove = Math.tan(theta) > mu;
    const a = willMove ? g*(Math.sin(theta)-mu*Math.cos(theta)) : 0;
    return {thetaDeg,theta,mu,willMove,a};
  }

  const baseX=40, baseY=H-30, inclineLen=460;

  function draw(p, s){
    ctx.clearRect(0,0,W,H);
    const topX = baseX, topY = baseY - inclineLen*Math.sin(p.theta);
    const botX = baseX + inclineLen*Math.cos(p.theta), botY = baseY;
    // incline triangle
    ctx.fillStyle='rgba(150,150,150,.15)';
    ctx.beginPath(); ctx.moveTo(topX,topY); ctx.lineTo(botX,botY); ctx.lineTo(topX,botY); ctx.closePath(); ctx.fill();
    ctx.strokeStyle=getCss('--text-soft'); ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(topX,topY); ctx.lineTo(botX,botY); ctx.lineTo(topX,botY); ctx.closePath(); ctx.stroke();
    // block position along incline (distance s from top)
    const bx = topX + s*Math.cos(p.theta);
    const by = topY + s*Math.sin(p.theta);
    const size=22;
    ctx.save();
    ctx.translate(bx,by); ctx.rotate(p.theta);
    ctx.fillStyle = getCss('--sim')||'#E1556B';
    ctx.fillRect(-size/2,-size,size,size);
    ctx.restore();
    // angle label
    ctx.fillStyle = getCss('--text'); ctx.font='13px sans-serif';
    ctx.fillText(p.thetaDeg.toFixed(0)+'°', topX+30, botY-8);
  }

  function reset(){
    running=false; t=0;
    const p = compute();
    draw(p,0);
    const statusEl = document.getElementById('simIncStatus');
    if(p.willMove){
      statusEl.innerHTML = `<span class="status-pill warn">⚠ ලිස්සයි (tanθ > μ)</span>`;
    } else {
      statusEl.innerHTML = `<span class="status-pill ok">✔ ස්ථිතිකව රැඳේ (tanθ ≤ μ)</span>`;
    }
    document.getElementById('simIncReadout').innerHTML = p.willMove
      ? `a = g(sinθ − μcosθ) = <b>${p.a.toFixed(2)}</b> ms⁻²`
      : `a = 0 ms⁻² (ස්ථිතික ඝර්ෂණය ප්‍රමාණවත්)`;
  }

  function step(){
    const p = compute();
    if(!p.willMove){ running=false; return; }
    const s = 0.5*p.a*t*t;
    const maxS = inclineLen - 15;
    if(s >= maxS){ draw(p,maxS); running=false; return; }
    draw(p,s);
    document.getElementById('simIncReadout').innerHTML =
      `a=<b>${p.a.toFixed(2)}</b> ms⁻² &nbsp; t=<b>${t.toFixed(2)}</b>s &nbsp; s=<b>${s.toFixed(2)}</b>m`;
    t += 0.03;
    if(running){ const id=requestAnimationFrame(step); simAnimFrames.push(id); }
  }

  document.getElementById('simIncPlay').onclick = ()=>{
    if(running) return;
    const p = compute();
    if(!p.willMove){ return; }
    t=0; running=true; step();
  };
  document.getElementById('simIncReset').onclick = reset;
  reset();
}

/* ---- 3. Atwood Machine ---- */
function initAtwoodSim(){
  const canvas = document.getElementById('simAtCanvas');
  const ctx = canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  let running=false, t=0;

  function compute(){
    const M = parseFloat(document.getElementById('simAtM').value)||5;
    const m = parseFloat(document.getElementById('simAtm').value)||4;
    const g=9.8;
    const a = ((M-m)/(M+m))*g;
    const T = (2*M*m*g)/(M+m);
    return {M,m,g,a,T};
  }

  const pulleyX=W/2, pulleyY=40, pulleyR=22, ropeDrop=170;

  function draw(p, disp){
    ctx.clearRect(0,0,W,H);
    // stand
    ctx.strokeStyle=getCss('--text-soft'); ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(pulleyX,10); ctx.lineTo(pulleyX,pulleyY); ctx.stroke();
    // pulley
    ctx.beginPath(); ctx.arc(pulleyX,pulleyY,pulleyR,0,Math.PI*2); ctx.stroke();
    const leftX=pulleyX-70, rightX=pulleyX+70;
    // M goes down if M>m => disp positive moves M down, m up
    const My = pulleyY+ropeDrop*0.4 + disp;
    const my = pulleyY+ropeDrop*0.4 - disp;
    ctx.beginPath(); ctx.moveTo(leftX,pulleyY); ctx.lineTo(leftX,My); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(rightX,pulleyY); ctx.lineTo(rightX,my); ctx.stroke();
    const sizeM = 20+Math.min(p.M,20)*1.2, sizem = 20+Math.min(p.m,20)*1.2;
    ctx.fillStyle='#4C6B9A';
    ctx.fillRect(leftX-sizeM/2, My, sizeM, sizeM);
    ctx.fillStyle=getCss('--text'); ctx.font='12px sans-serif'; ctx.textAlign='center';
    ctx.fillText('M='+p.M+'kg', leftX, My+sizeM+16);
    ctx.fillStyle='#C9821E';
    ctx.fillRect(rightX-sizem/2, my, sizem, sizem);
    ctx.fillStyle=getCss('--text');
    ctx.fillText('m='+p.m+'kg', rightX, my+sizem+16);
    ctx.textAlign='left';
  }

  function reset(){
    running=false; t=0;
    const p = compute();
    draw(p,0);
    document.getElementById('simAtReadout').innerHTML =
      `a = <b>${p.a.toFixed(2)}</b> ms⁻² &nbsp; T = <b>${p.T.toFixed(2)}</b> N &nbsp; ${p.a>0? '(M පහළට)': p.a<0? '(m පහළට)':'(සමතුලිත)'}`;
  }

  function step(){
    const p = compute();
    const disp = 0.5*Math.abs(p.a)*t*t*(p.a>=0?1:-1);
    const maxDisp = 60;
    if(Math.abs(disp) >= maxDisp){ draw(p, maxDisp*Math.sign(p.a||1)); running=false; return; }
    draw(p, disp);
    t += 0.03;
    if(running){ const id=requestAnimationFrame(step); simAnimFrames.push(id); }
  }

  document.getElementById('simAtPlay').onclick = ()=>{ if(running) return; t=0; running=true; step(); };
  document.getElementById('simAtReset').onclick = reset;
  reset();
}

/* ---- 4. 1D Collisions ---- */
function initCollisionSim(){
  const canvas = document.getElementById('simColCanvas');
  const ctx = canvas.getContext('2d');
  const W=canvas.width, H=canvas.height, groundY=H-40;
  let running=false;
  let x1=90, x2=470, v1=0, v2=0, collided=false, m1=2, m2=3;

  function radiusOf(m){ return 12 + Math.min(m,10)*2.2; }

  function readInputs(){
    m1 = parseFloat(document.getElementById('simColM1').value)||2;
    m2 = parseFloat(document.getElementById('simColM2').value)||3;
    v1 = parseFloat(document.getElementById('simColU1').value)||0;
    v2 = parseFloat(document.getElementById('simColU2').value)||0;
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle=getCss('--line'); ctx.beginPath(); ctx.moveTo(0,groundY); ctx.lineTo(W,groundY); ctx.stroke();
    const r1=radiusOf(m1), r2=radiusOf(m2);
    ctx.fillStyle='#4C6B9A';
    ctx.beginPath(); ctx.arc(x1,groundY-r1,r1,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=getCss('--text'); ctx.font='12px sans-serif'; ctx.textAlign='center';
    ctx.fillText('m₁='+m1, x1, groundY-r1*2-8);
    ctx.fillStyle='#C9821E';
    ctx.beginPath(); ctx.arc(x2,groundY-r2,r2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=getCss('--text');
    ctx.fillText('m₂='+m2, x2, groundY-r2*2-8);
    ctx.textAlign='left';
  }

  function reset(){
    running=false; collided=false;
    readInputs();
    x1=90; x2=470;
    draw();
    document.getElementById('simColReadout').innerHTML = `ගැටුමට පෙර: v₁=<b>${v1}</b> ms⁻¹, v₂=<b>${v2}</b> ms⁻¹`;
  }

  function step(){
    const r1=radiusOf(m1), r2=radiusOf(m2);
    x1 += v1*0.4; x2 += v2*0.4;
    if(!collided && x2-x1 <= r1+r2){
      collided = true;
      const type = document.getElementById('simColType').value;
      if(type==='elastic'){
        const nv1 = ((m1-m2)/(m1+m2))*v1 + ((2*m2)/(m1+m2))*v2;
        const nv2 = ((2*m1)/(m1+m2))*v1 + ((m2-m1)/(m1+m2))*v2;
        v1=nv1; v2=nv2;
        document.getElementById('simColReadout').innerHTML =
          `ගැටුමෙන් පසු (ප්‍රත්‍යාස්ථ): v₁=<b>${v1.toFixed(2)}</b> ms⁻¹, v₂=<b>${v2.toFixed(2)}</b> ms⁻¹`;
      } else {
        const common = (m1*v1+m2*v2)/(m1+m2);
        v1=common; v2=common;
        document.getElementById('simColReadout').innerHTML =
          `ගැටුමෙන් පසු (අප්‍රත්‍යාස්ථ): v = <b>${common.toFixed(2)}</b> ms⁻¹ (එකට ගමන් කරයි)`;
      }
    }
    // bounds
    if(x1<20) {x1=20; v1=Math.abs(v1);}
    if(x2>W-20){x2=W-20; v2=-Math.abs(v2);}
    draw();
    if(running){ const id=requestAnimationFrame(step); simAnimFrames.push(id); }
  }

  document.getElementById('simColPlay').onclick = ()=>{
    if(running) return;
    if(!collided && x1===90 && x2===470) readInputs();
    running=true; step();
  };
  document.getElementById('simColReset').onclick = reset;
  reset();
}

/* ---- 5. Spring SHM ---- */
function initSpringSim(){
  const canvas = document.getElementById('simSpCanvas');
  const ctx = canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  let running=false, t=0;

  function compute(){
    const k = parseFloat(document.getElementById('simSpK').value)||40;
    const m = parseFloat(document.getElementById('simSpM').value)||2;
    const A = parseFloat(document.getElementById('simSpA').value)||0.3;
    const omega = Math.sqrt(k/m);
    const T = 2*Math.PI/omega;
    return {k,m,A,omega,T};
  }

  const anchorY=20, pxPerM=250, eqY=140;

  function drawSpring(x0,y0,x1,y1,coils){
    const dx=x1-x0, dy=y1-y0, len=Math.hypot(dx,dy);
    const nx=-dy/len, ny=dx/len;
    ctx.beginPath(); ctx.moveTo(x0,y0);
    const segs=coils*2;
    for(let i=1;i<segs;i++){
      const f=i/segs;
      const amp = (i%2===0)? 0 : 14;
      ctx.lineTo(x0+dx*f+nx*amp, y0+dy*f+ny*amp);
    }
    ctx.lineTo(x1,y1);
    ctx.stroke();
  }

  function draw(p, x){
    ctx.clearRect(0,0,W,H);
    const cx = W/2;
    const massY = eqY + x*pxPerM;
    ctx.strokeStyle = getCss('--text-soft'); ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(cx-60,anchorY); ctx.lineTo(cx+60,anchorY); ctx.stroke();
    ctx.strokeStyle = getCss('--sim')||'#E1556B'; ctx.lineWidth=2;
    drawSpring(cx,anchorY,cx,massY-24,10);
    ctx.fillStyle=getCss('--sim')||'#E1556B';
    ctx.fillRect(cx-26,massY-24,52,48);
    // equilibrium dashed line
    ctx.strokeStyle='rgba(150,150,150,.4)'; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(cx-90,eqY); ctx.lineTo(cx+90,eqY); ctx.stroke();
    ctx.setLineDash([]);
  }

  function reset(){
    running=false; t=0;
    const p = compute();
    draw(p, p.A);
    document.getElementById('simSpReadout').innerHTML = `T = <b>${p.T.toFixed(2)}</b> s &nbsp; ω = <b>${p.omega.toFixed(2)}</b> rad/s`;
    document.getElementById('simSpEpBar').style.width='100%';
    document.getElementById('simSpEkBar').style.width='0%';
  }

  function step(){
    const p = compute();
    const x = p.A*Math.cos(p.omega*t);
    const v = -p.A*p.omega*Math.sin(p.omega*t);
    const Ep = 0.5*p.k*x*x;
    const Ek = 0.5*p.m*v*v;
    const Emax = 0.5*p.k*p.A*p.A;
    draw(p,x);
    document.getElementById('simSpEpBar').style.width = Math.min(100,(Ep/Emax)*100)+'%';
    document.getElementById('simSpEkBar').style.width = Math.min(100,(Ek/Emax)*100)+'%';
    document.getElementById('simSpReadout').innerHTML =
      `T=<b>${p.T.toFixed(2)}</b>s &nbsp; x=<b>${x.toFixed(3)}</b>m &nbsp; Ep=<b>${Ep.toFixed(2)}</b>J &nbsp; Ek=<b>${Ek.toFixed(2)}</b>J`;
    t += 0.02;
    if(running){ const id=requestAnimationFrame(step); simAnimFrames.push(id); }
  }

  document.getElementById('simSpPlay').onclick = ()=>{ if(running) return; running=true; step(); };
  document.getElementById('simSpReset').onclick = reset;
  reset();
}

function getCss(varName){
  return getComputedStyle(document.body).getPropertyValue(varName).trim();
}

/* ===================== SEARCH ===================== */
document.getElementById('searchBox').addEventListener('input', (e)=>{
  searchTerm = e.target.value.trim();
  if(searchTerm && activeTab==='calculators') activeTab = chapters[0].id;
  if(searchTerm){
    // if searching, show results across ALL chapters combined
    renderSearchResults(searchTerm);
  } else {
    render();
  }
});

function renderSearchResults(term){
  buildTabs();
  mainArea.innerHTML = '';
  const head = document.createElement('div');
  head.className='chapter-head';
  head.innerHTML = `<h2>🔎 සෙවුම් ප්‍රතිඵල</h2><span class="en">"${term}"</span>`;
  mainArea.appendChild(head);

  let count=0;
  chapters.forEach(ch=>{
    ch.items.forEach(it=>{
      if(matches(it, ch, term)){
        count++;
        const card=document.createElement('div');
        card.className='card';
        card.style.setProperty('--accent', ch.accent);
        let inner = `<div class="card-top"><span class="badge">${it.code}</span><h3>${it.title}</h3></div>`;
        inner += `<p class="note" style="opacity:.7">${ch.si} · ${ch.en}</p>`;
        if(it.note) inner += `<p class="note">${it.note}</p>`;
        if(it.tex) inner += `<div class="formula-box tex">\\[${it.tex}\\]</div>`;
        card.innerHTML = inner;
        mainArea.appendChild(card);
      }
    });
  });
  if(count===0){
    const e=document.createElement('div');
    e.className='empty-state';
    e.textContent='ගැළපෙන ප්‍රතිඵල හමු නොවීය. වෙනත් වචනයක් උත්සාහ කරන්න.';
    mainArea.appendChild(e);
  }
  if(window.renderMathInElement){
    renderMathInElement(mainArea, {
      delimiters:[{left:"\\[", right:"\\]", display:true},{left:"\\(", right:"\\)", display:false}],
      throwOnError:false
    });
  }
}

/* ===================== THEME & REVISION MODE ===================== */
const themeToggle = document.getElementById('themeToggle');
themeToggle.onclick = ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  if(cur==='dark'){
    document.documentElement.removeAttribute('data-theme');
    themeToggle.textContent='🌙';
    localStorage.setItem('mech-theme','light');
  } else {
    document.documentElement.setAttribute('data-theme','dark');
    themeToggle.textContent='☀️';
    localStorage.setItem('mech-theme','dark');
  }
};
if(localStorage.getItem('mech-theme')==='dark'){
  document.documentElement.setAttribute('data-theme','dark');
  themeToggle.textContent='☀️';
}

const revisionToggle = document.getElementById('revisionToggle');
revisionToggle.onclick = ()=>{
  document.body.classList.toggle('revision-mode');
  revisionToggle.classList.toggle('active');
  render();
};

/* ===================== INIT ===================== */
render();
