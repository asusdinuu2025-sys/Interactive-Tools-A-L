<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>ඉලෙක්ට්‍රොනික විද්‍යාව | A/L භෞතික විද්‍යාව</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080d16;
  --bg-elev:#0e1524;
  --surface:#131b2e;
  --surface-2:#1a2540;
  --border:#25335a;
  --border-soft:#1c2846;
  --text:#eef3fb;
  --text-dim:#9fb0cf;
  --text-faint:#647episode;
  --teal:#2dd9c4;
  --teal-dim:#1a8f80;
  --blue:#5b8cff;
  --amber:#f5b942;
  --red:#ff5f7e;
  --green:#3ee089;
  --purple:#b389f9;
  --radius:16px;
  --radius-sm:10px;
  --font-si:'Noto Sans Sinhala',sans-serif;
  --font-num:'Space Grotesk',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-si);
  min-height:100vh;
  overflow-x:hidden;
  padding-bottom:78px;
  position:relative;
}
body::before{
  content:"";
  position:fixed; inset:0;
  background-image:
    radial-gradient(circle at 15% 8%, rgba(45,217,196,0.08), transparent 40%),
    radial-gradient(circle at 85% 92%, rgba(91,140,255,0.10), transparent 45%),
    repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 42px),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 42px);
  pointer-events:none;
  z-index:0;
}
.app{position:relative; z-index:1; max-width:640px; margin:0 auto;}

/* ===== TOP RAIL (signature element) ===== */
.top-rail{
  position:sticky; top:0; z-index:50;
  background:linear-gradient(180deg, var(--bg-elev) 0%, rgba(14,21,36,0.96) 100%);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border-soft);
}
.rail-strip{
  height:5px; width:100%;
  background:linear-gradient(90deg, transparent, var(--teal) 20%, var(--blue) 50%, var(--teal) 80%, transparent);
  background-size:200% 100%;
  animation:railflow 5s linear infinite;
  opacity:.65;
}
@keyframes railflow{ to{ background-position:-200% 0; } }
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px;
}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{
  width:38px; height:38px; border-radius:10px;
  background:linear-gradient(135deg, var(--surface-2), var(--surface));
  border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.brand-title{font-family:var(--font-num); font-weight:700; font-size:15px; letter-spacing:.3px; line-height:1.1;}
.brand-sub{font-size:11px; color:var(--text-dim); margin-top:1px;}
.icon-btn{
  width:40px; height:40px; border-radius:10px;
  background:var(--surface); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  color:var(--teal); cursor:pointer;
  transition:transform .15s ease, background .15s ease;
}
.icon-btn:active{transform:scale(.92); background:var(--surface-2);}

/* ===== NAV TABS (section sub-nav) ===== */
.section-pill-row{
  display:flex; gap:8px; padding:0 16px 12px; overflow-x:auto;
}
.section-pill{
  flex-shrink:0; padding:7px 13px; border-radius:999px; font-size:12.5px;
  border:1px solid var(--border); background:var(--surface); color:var(--text-dim);
  white-space:nowrap; cursor:pointer; transition:.15s;
}
.section-pill.active{ background:var(--teal); color:#04231f; border-color:var(--teal); font-weight:600; }

/* ===== MAIN CONTENT ===== */
main{ padding:18px 16px 24px; }
.view{ display:none; animation:fadein .35s ease; }
.view.active{ display:block; }
@keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

.hero-card{
  border-radius:var(--radius);
  padding:20px;
  margin-bottom:18px;
  position:relative; overflow:hidden;
  border:1px solid var(--border);
  background:linear-gradient(135deg, var(--surface-2) 0%, var(--surface) 70%);
}
.hero-card .pin-row{position:absolute; top:0; left:16px; display:flex; gap:6px;}
.pin{width:6px; height:10px; border-radius:0 0 3px 3px; background:var(--accent-color, var(--teal)); opacity:.8;}
.hero-eyebrow{font-family:var(--font-mono); font-size:11px; color:var(--teal); letter-spacing:1.5px; text-transform:uppercase;}
.hero-title{font-size:22px; font-weight:700; margin:6px 0 8px; line-height:1.35;}
.hero-desc{font-size:13.5px; color:var(--text-dim); line-height:1.7;}

h2.section-h{
  font-size:16px; font-weight:700; margin:26px 0 12px;
  display:flex; align-items:center; gap:8px;
  color:var(--text);
}
h2.section-h .tag-dot{width:8px; height:8px; border-radius:2px; background:var(--teal); flex-shrink:0;}
h3.sub-h{ font-size:14px; font-weight:600; margin:16px 0 8px; color:var(--teal);}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:12px;
  position:relative;
}
.card .pin-row{position:absolute; top:-1px; left:14px; display:flex; gap:5px;}
.card p{font-size:13.5px; line-height:1.85; color:var(--text); margin:0 0 8px;}
.card p:last-child{margin-bottom:0;}
.card ul{margin:6px 0; padding-inline-start:20px;}
.card li{font-size:13.5px; line-height:1.85; color:var(--text); margin-bottom:4px;}
.formula-box{
  font-family:var(--font-mono); font-size:14px; color:var(--teal);
  background:var(--bg-elev); border:1px solid var(--border-soft);
  border-radius:var(--radius-sm); padding:10px 14px; margin:8px 0;
  display:inline-block; min-width:60%; text-align:center;
}
.note-box{
  background:rgba(245,185,66,0.08); border:1px solid rgba(245,185,66,0.35);
  border-radius:var(--radius-sm); padding:10px 12px; font-size:12.5px; color:var(--amber);
  margin-top:10px; line-height:1.7;
}
.compare-table{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:6px;}
.compare-table th{ background:var(--surface-2); color:var(--teal); padding:8px 6px; text-align:left; font-weight:600; border-bottom:1px solid var(--border);}
.compare-table td{ padding:7px 6px; border-bottom:1px solid var(--border-soft); color:var(--text-dim);}
.compare-table tr:last-child td{border-bottom:none;}

.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.chip-list{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
.chip{ background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:5px 11px; font-size:12px; color:var(--text-dim);}

/* accordion for device list */
.accordion-item{ border:1px solid var(--border); border-radius:var(--radius-sm); margin-bottom:8px; overflow:hidden; background:var(--bg-elev);}
.accordion-head{ padding:12px 14px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; font-size:13.5px; font-weight:600;}
.accordion-head .chevron{ transition:transform .2s ease; color:var(--teal); }
.accordion-item.open .chevron{ transform:rotate(180deg); }
.accordion-body{ max-height:0; overflow:hidden; transition:max-height .3s ease; padding:0 14px;}
.accordion-item.open .accordion-body{ padding:0 14px 14px; }
.accordion-body p, .accordion-body li{font-size:13px; color:var(--text-dim); line-height:1.8;}

/* ===== TOOL / CALCULATOR ===== */
.tool-card{
  background:var(--surface); border:1px solid var(--teal-dim);
  border-radius:var(--radius); padding:16px; margin:14px 0 20px;
}
.tool-title{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:14px; color:var(--teal); margin-bottom:12px;}
.field-row{ display:flex; flex-direction:column; gap:4px; margin-bottom:10px;}
.field-row label{ font-size:12px; color:var(--text-dim);}
.field-row input, .field-row select{
  background:var(--bg-elev); border:1px solid var(--border); color:var(--text);
  border-radius:var(--radius-sm); padding:10px 12px; font-size:14px; font-family:var(--font-num);
  outline:none; width:100%;
}
.field-row input:focus, .field-row select:focus{ border-color:var(--teal); }
.seg-control{ display:flex; background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius-sm); padding:3px; margin-bottom:10px;}
.seg-btn{ flex:1; text-align:center; padding:8px 4px; font-size:12.5px; border-radius:8px; cursor:pointer; color:var(--text-dim); transition:.15s;}
.seg-btn.active{ background:var(--teal); color:#04231f; font-weight:700;}
.btn-primary{
  width:100%; padding:11px; border-radius:var(--radius-sm); border:none;
  background:linear-gradient(135deg, var(--teal), var(--blue)); color:#04121a;
  font-weight:700; font-size:13.5px; cursor:pointer; font-family:var(--font-si);
  margin-top:4px;
}
.btn-primary:active{ transform:scale(.98); }
.result-box{
  margin-top:12px; background:var(--bg-elev); border:1px dashed var(--border);
  border-radius:var(--radius-sm); padding:12px; font-size:13px;
}
.result-row{ display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--border-soft); font-family:var(--font-num);}
.result-row:last-child{ border-bottom:none; }
.result-row .rlabel{ color:var(--text-dim); font-family:var(--font-si); font-size:12.5px;}
.result-row .rval{ color:var(--teal); font-weight:700;}

/* truth table tool */
.io-toggle-row{ display:flex; gap:10px; justify-content:center; margin:12px 0;}
.bit-toggle{
  width:52px; height:52px; border-radius:12px; background:var(--bg-elev); border:1px solid var(--border);
  display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer;
}
.bit-toggle .bit-label{ font-size:10px; color:var(--text-dim);}
.bit-toggle .bit-val{ font-family:var(--font-num); font-weight:700; font-size:18px; color:var(--text);}
.bit-toggle.on{ background:rgba(45,217,196,0.15); border-color:var(--teal);}
.bit-toggle.on .bit-val{ color:var(--teal); }
.out-display{
  text-align:center; margin:10px auto; width:90px; height:90px; border-radius:16px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:var(--bg-elev); border:2px solid var(--border);
}
.out-display .bit-val{ font-size:34px; }
.out-display.on{ border-color:var(--green); box-shadow:0 0 22px rgba(62,224,137,.25);}
.out-display.on .bit-val{ color:var(--green);}
.mini-truth{ width:100%; border-collapse:collapse; margin-top:14px; font-size:13px;}
.mini-truth th,.mini-truth td{ text-align:center; padding:6px 4px; border-bottom:1px solid var(--border-soft); font-family:var(--font-num);}
.mini-truth th{ color:var(--teal); }
.mini-truth tr.current-row{ background:rgba(91,140,255,0.12); }

/* SVG wrap */
.svg-wrap{ background:var(--bg-elev); border:1px solid var(--border-soft); border-radius:var(--radius-sm); padding:10px; margin:10px 0; overflow-x:auto;}
.svg-wrap svg{ display:block; margin:0 auto; max-width:100%; height:auto; }
.svg-caption{ text-align:center; font-size:11px; color:var(--text-faint); margin-top:4px;}

/* ===== QUIZ ===== */
.quiz-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px; margin-bottom:14px;
}
.quiz-progress{ font-family:var(--font-mono); font-size:11px; color:var(--text-dim); margin-bottom:8px;}
.quiz-q{ font-size:14px; font-weight:600; margin-bottom:12px; line-height:1.7;}
.quiz-opt{
  display:block; width:100%; text-align:right; padding:11px 14px; margin-bottom:8px;
  background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius-sm);
  color:var(--text); font-size:13px; font-family:var(--font-si); cursor:pointer; transition:.15s;
}
.quiz-opt:active{ transform:scale(.98); }
.quiz-opt.correct{ border-color:var(--green); background:rgba(62,224,137,0.12); color:var(--green); font-weight:600;}
.quiz-opt.wrong{ border-color:var(--red); background:rgba(255,95,126,0.12); color:var(--red); font-weight:600;}
.quiz-opt.disabled{ pointer-events:none; opacity:.65; }
.quiz-explain{
  margin-top:10px; padding:11px 12px; border-radius:var(--radius-sm); font-size:12.5px; line-height:1.8;
  background:rgba(91,140,255,0.08); border:1px solid rgba(91,140,255,0.3); color:var(--text-dim); display:none;
}
.quiz-explain.show{ display:block; }
.quiz-nextbtn{
  margin-top:12px; width:100%; padding:10px; border-radius:var(--radius-sm); border:1px solid var(--teal);
  background:transparent; color:var(--teal); font-weight:700; font-size:13px; cursor:pointer; display:none;
}
.quiz-nextbtn.show{ display:block; }
.quiz-score{ text-align:center; padding:20px 10px; }
.quiz-score .big-num{ font-family:var(--font-num); font-size:42px; font-weight:700; color:var(--teal);}
.quiz-restart{
  margin-top:14px; padding:10px 20px; border-radius:999px; border:none;
  background:var(--teal); color:#04231f; font-weight:700; cursor:pointer;
}

/* ===== BOTTOM NAV ===== */
.bottom-nav{
  position:fixed; bottom:0; left:0; right:0; z-index:60;
  background:rgba(14,21,36,0.92); backdrop-filter:blur(14px);
  border-top:1px solid var(--border-soft);
  display:flex;
}
.bottom-nav .navmax{ max-width:640px; margin:0 auto; display:flex; width:100%;}
.nav-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:9px 4px 10px; color:var(--text-faint); background:none; border:none; cursor:pointer;
  font-family:var(--font-si);
}
.nav-btn svg{ width:21px; height:21px; }
.nav-btn span{ font-size:10.5px; }
.nav-btn.active{ color:var(--teal); }
.nav-btn.active svg{ filter:drop-shadow(0 0 6px rgba(45,217,196,.5)); }

/* ===== DRAWER (formula sheet) ===== */
.drawer-overlay{
  position:fixed; inset:0; background:rgba(3,6,12,0.6); z-index:80; opacity:0; pointer-events:none; transition:opacity .25s;
}
.drawer-overlay.open{ opacity:1; pointer-events:auto; }
.drawer{
  position:fixed; right:0; top:0; bottom:0; width:88%; max-width:380px; z-index:90;
  background:var(--bg-elev); border-left:1px solid var(--border);
  transform:translateX(100%); transition:transform .3s ease;
  overflow-y:auto; padding:18px;
}
.drawer.open{ transform:translateX(0); }
.drawer-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
.drawer-head h3{ font-size:15px; margin:0; }
.formula-search{
  width:100%; padding:10px 12px; border-radius:var(--radius-sm); border:1px solid var(--border);
  background:var(--surface); color:var(--text); font-size:13px; margin-bottom:14px; font-family:var(--font-si);
}
.fsheet-group{ margin-bottom:16px; }
.fsheet-group h4{ font-size:12px; color:var(--teal); text-transform:uppercase; letter-spacing:1px; margin:0 0 8px; font-family:var(--font-mono);}
.fsheet-item{ display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border-soft); gap:10px;}
.fsheet-item .fname{ font-size:12px; color:var(--text-dim); flex:1;}
.fsheet-item .fval{ font-family:var(--font-mono); font-size:12.5px; color:var(--text); white-space:nowrap;}
.fsheet-item.hidden{ display:none; }

/* utility */
.two-col-imgs{ display:flex; gap:10px; }
.two-col-imgs .svg-wrap{ flex:1; }
::selection{ background:var(--teal); color:#04231f; }
@media(min-width:640px){
  .grid2{ grid-template-columns:1fr 1fr 1fr; }
}
</style>
</head>
<body>
<div class="app">

  <!-- TOP RAIL -->
  <div class="top-rail">
    <div class="rail-strip"></div>
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 12h4l2-7 4 14 2-7h4" stroke="#2dd9c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div>
          <div class="brand-title">ඉලෙක්ට්‍රොනික විද්‍යාව</div>
          <div class="brand-sub">A/L භෞතික විද්‍යාව • අන්තර්ක්‍රියාකාරී නිබන්ධනය</div>
        </div>
      </div>
      <div class="icon-btn" onclick="openDrawer()" aria-label="සූත්‍ර පත්‍රිකාව">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M11 4a7 7 0 105.6 11.2l4.2 4.2M11 4a7 7 0 016.7 9.05M11 4v0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
    </div>
    <div class="section-pill-row" id="pillRow"></div>
  </div>

  <main id="mainContent">
    <!-- Views injected by JS -->
  </main>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <div class="navmax" id="bottomNav"></div>
</nav>

<!-- DRAWER -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h3>⚡ ඉක්මන් සූත්‍ර පත්‍රිකාව</h3>
    <div class="icon-btn" onclick="closeDrawer()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </div>
  </div>
  <input class="formula-search" id="formulaSearch" placeholder="සූත්‍රයක් සොයන්න... (උදා: rms, β, gain)" oninput="filterFormulas()">
  <div id="formulaList"></div>
</div>

<script>
/* =========================================================
   DATA
========================================================= */
const SECTIONS = [
  {id:'diode', label:'ඩයෝඩ', icon:`<path d="M4 12h6l2-4v8l2-4h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`},
  {id:'transistor', label:'ට්‍රාන්සිස්ටර්', icon:`<rect x="4" y="4" width="16" height="16" rx="3" stroke="currentColor" stroke-width="2"/><path d="M9 8v8M15 8v3l-4 1v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>`},
  {id:'opamp', label:'කාරකාත්මක වර්ධක', icon:`<path d="M5 6v12l14-6z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>`},
  {id:'logic', label:'තාර්කික ද්වාර', icon:`<path d="M4 8v8h4a5 5 0 000-8H4z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="18" cy="12" r="1.6" fill="currentColor"/>`}
];

/* FORMULA SHEET DATA */
const FORMULAS = [
  {group:'ඩයෝඩ', name:'Si බාධක විභවය', val:'0.6 – 0.7 V'},
  {group:'ඩයෝඩ', name:'Ge බාධක විභවය', val:'0.2 – 0.3 V'},
  {group:'ඩයෝඩ', name:'RMS (සම්පූර්ණ / ඉතා අඩු ලය)', val:'Vrms = Vmax/√2'},

/* =========================================================
   RENDER: NAV
========================================================= */
const bottomNav = document.getElementById('bottomNav');
const pillRow = document.getElementById('pillRow');
SECTIONS.forEach((s,i)=>{
  const btn = document.createElement('button');
  btn.className = 'nav-btn'+(i===0?' active':'');
  btn.id = 'navbtn-'+s.id;
  btn.onclick = ()=>showSection(s.id);
  btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none">${s.icon}</svg><span>${s.label}</span>`;
  bottomNav.appendChild(btn);

  const pill = document.createElement('div');
  pill.className = 'section-pill'+(i===0?' active':'');
  pill.id = 'pill-'+s.id;
  pill.textContent = s.label;
  pill.onclick = ()=>showSection(s.id);
  pillRow.appendChild(pill);
});

function showSection(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+id).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('navbtn-'+id).classList.add('active');
  document.querySelectorAll('.section-pill').forEach(b=>b.classList.remove('active'));
  document.getElementById('pill-'+id).classList.add('active');
  window.scrollTo({top:0, behavior:'smooth'});
}

/* =========================================================
   DRAWER
========================================================= */
function openDrawer(){
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerOverlay').classList.add('open');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerOverlay').classList.remove('open');
}
function renderFormulas(){
  const listEl = document.getElementById('formulaList');
  const groups = {};
  FORMULAS.forEach(f=>{ (groups[f.group] = groups[f.group]||[]).push(f); });
  let html='';
  Object.keys(groups).forEach(g=>{
    html += `<div class="fsheet-group"><h4>${g}</h4>`;
    groups[g].forEach(f=>{
      html += `<div class="fsheet-item" data-search="${(f.name+f.val).toLowerCase()}"><div class="fname">${f.name}</div><div class="fval">${f.val}</div></div>`;
    });
    html += `</div>`;
  });
  listEl.innerHTML = html;
}
function filterFormulas(){
  const q = document.getElementById('formulaSearch').value.toLowerCase();
  document.querySelectorAll('.fsheet-item').forEach(el=>{
    el.classList.toggle('hidden', q && !el.dataset.search.includes(q));
  });
}
renderFormulas();

const mainContent = document.getElementById('mainContent');

function accordion(items){
  return items.map((it,i)=>`
    <div class="accordion-item" id="acc-${it.id}">
      <div class="accordion-head" onclick="toggleAcc('${it.id}')">
        <span>${it.title}</span>
        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="accordion-body"><div style="padding-top:10px">${it.body}</div></div>
    </div>`).join('');
}
function toggleAcc(id){
  const el = document.getElementById('acc-'+id);
  const wasOpen = el.classList.contains('open');
  el.classList.toggle('open');
  const body = el.querySelector('.accordion-body');
  body.style.maxHeight = (!wasOpen) ? body.scrollHeight+40+'px' : '0px';
}

/* =========================================================
   CALCULATORS
========================================================= */
let rectType = 'half';
function setRectType(t){
  rectType = t;
  document.querySelectorAll('#rectSeg .seg-btn').forEach(b=>b.classList.toggle('active', b.dataset.v===t));
}
function calcRect(){
  const vmax = parseFloat(document.getElementById('rectVmax').value)||0;
  const vp = parseFloat(document.getElementById('rectVp').value)||0;
  const vOut = Math.max(vmax - vp, 0);
  const vrms = rectType==='half' ? vmax/Math.PI : (2*vmax)/Math.PI;
  const vavg = rectType==='half' ? vmax/Math.PI : (2*vmax)/Math.PI;
  const box = document.getElementById('rectResult');
  box.style.display='block';
  box.innerHTML = `
    <div class="result-row"><span class="rlabel">වර්ගය</span><span class="rval">${rectType==='half'?'අර්ධ තරංග':'පූර්ණ තරංග (Bridge)'}</span></div>
    <div class="result-row"><span class="rlabel">ප්‍රායෝගික ශිඛර ප්‍රතිදානය (Vmax − Vp)</span><span class="rval">${vOut.toFixed(3)} V</span></div>
    <div class="result-row"><span class="rlabel">V_rms</span><span class="rval">${vrms.toFixed(3)} V</span></div>
    <div class="result-row"><span class="rlabel">සූත්‍රය</span><span class="rval" style="font-size:11.5px">${rectType==='half'?'Vmax/π':'2Vmax/π'}</span></div>
  `;
}

function calcBJT(){
  const ib = parseFloat(document.getElementById('bjtIB').value)||0; // µA
  const beta = parseFloat(document.getElementById('bjtBeta').value)||0;
  const icUA = beta*ib;      // µA
  const icMA = icUA/1000;    // mA
  const ibMA = ib/1000;
  const ieMA = ibMA + icMA;
  const alpha = ieMA>0 ? icMA/ieMA : 0;
  const box = document.getElementById('bjtResult');
  box.style.display='block';
  box.innerHTML = `
    <div class="result-row"><span class="rlabel">සංග්‍රාහක ධාරාව I_C</span><span class="rval">${icMA.toFixed(4)} mA</span></div>
    <div class="result-row"><span class="rlabel">විමෝචක ධාරාව I_E</span><span class="rval">${ieMA.toFixed(4)} mA</span></div>
    <div class="result-row"><span class="rlabel">ධාරා ලාභය α</span><span class="rval">${alpha.toFixed(4)}</span></div>
    <div class="result-row"><span class="rlabel">ධාරා ලාභය β (ලබාදුන්)</span><span class="rval">${beta}</span></div>
  `;
}

let opampType = 'inv';
function setOpampType(t){
  opampType = t;
  document.querySelectorAll('#opampSeg .seg-btn').forEach(b=>b.classList.toggle('active', b.dataset.v===t));
}
function calcOpamp(){
  const rf = parseFloat(document.getElementById('opRf').value)||0;
  const r = parseFloat(document.getElementById('opR').value)||1;
  const vin = parseFloat(document.getElementById('opVin').value)||0;
  const gain = opampType==='inv' ? -(rf/r) : (rf/r)+1;
  const vout = gain*vin;
  const box = document.getElementById('opampResult');
  box.style.display='block';
  box.innerHTML = `
    <div class="result-row"><span class="rlabel">වින්‍යාසය</span><span class="rval">${opampType==='inv'?'Inverting':'Non-Inverting'}</span></div>
    <div class="result-row"><span class="rlabel">ලාභය (Gain)</span><span class="rval">${gain.toFixed(3)}</span></div>
    <div class="result-row"><span class="rlabel">ප්‍රතිදාන වෝල්ටියතාව Vout</span><span class="rval">${vout.toFixed(3)} V</span></div>
    <div class="result-row"><span class="rlabel">සූත්‍රය</span><span class="rval" style="font-size:11px">${opampType==='inv'?'−Rf/R':'(Rf/R)+1'}</span></div>
  `;
}

/* =========================================================
   LOGIC GATE TOOL
========================================================= */
const gateFns = {
  NOT: (a)=> a?0:1,
  OR: (a,b)=> (a||b)?1:0,
  AND:(a,b)=> (a&&b)?1:0,
  NOR:(a,b)=> (a||b)?0:1,
  NAND:(a,b)=>(a&&b)?0:1,
  XOR:(a,b)=> (a!==b)?1:0,
  XNOR:(a,b)=>(a===b)?1:0
};
let gateInputs = {A:0,B:0};
function renderGateTool(){
  const gate = document.getElementById('gateSelect').value;
  const isUnary = gate==='NOT';
  const row = document.getElementById('gateToggleRow');
  row.innerHTML = '';
  ['A'].concat(isUnary?[]:['B']).forEach(k=>{
    const div = document.createElement('div');
    div.className = 'bit-toggle'+(gateInputs[k]?' on':'');
    div.innerHTML = `<div class="bit-label">${k}</div><div class="bit-val">${gateInputs[k]}</div>`;
    div.onclick = ()=>{ gateInputs[k] = gateInputs[k]?0:1; renderGateTool(); };
    row.appendChild(div);
  });
  const out = gateFns[gate](gateInputs.A, gateInputs.B);
  const outDisp = document.getElementById('gateOutDisplay');
  outDisp.classList.toggle('on', !!out);
  document.getElementById('gateOutVal').textContent = out;

  // truth table
  const tbl = document.getElementById('gateTruthTable');
  let rowsHtml = '';
  if(isUnary){
    rowsHtml += `<tr><th>A</th><th>F</th></tr>`;
    [0,1].forEach(a=>{
      const f = gateFns[gate](a);
      const cur = (a===gateInputs.A);
      rowsHtml += `<tr class="${cur?'current-row':''}"><td>${a}</td><td>${f}</td></tr>`;
    });
  } else {
    rowsHtml += `<tr><th>A</th><th>B</th><th>F</th></tr>`;
    [0,1].forEach(a=>{
      [0,1].forEach(b=>{
        const f = gateFns[gate](a,b);
        const cur = (a===gateInputs.A && b===gateInputs.B);
        rowsHtml += `<tr class="${cur?'current-row':''}"><td>${a}</td><td>${b}</td><td>${f}</td></tr>`;
      });
    });
  }
  tbl.innerHTML = rowsHtml;
}
renderGateTool();

/* SR FLIP-FLOP (NOR based latch, with memory) */
let srState = {S:0, R:0, Q:0, Qbar:1};
function renderSR(){
  const row = document.getElementById('srToggleRow');
  row.innerHTML = '';
  ['S','R'].forEach(k=>{
    const div = document.createElement('div');
    div.className = 'bit-toggle'+(srState[k]?' on':'');
    div.innerHTML = `<div class="bit-label">${k}</div><div class="bit-val">${srState[k]}</div>`;
    div.onclick = ()=>{
      srState[k] = srState[k]?0:1;
      updateSRLogic();
      renderSR();
    };
    row.appendChild(div);
  });
  document.getElementById('srQVal').textContent = srState.Q;
  document.getElementById('srQbarVal').textContent = srState.Qbar;
  let msg = '';
  if(srState.S===1 && srState.R===0) msg = 'SET තත්වය — Q = 1';
  else if(srState.S===0 && srState.R===1) msg = 'RESET තත්වය — Q = 0';
  else if(srState.S===0 && srState.R===0) msg = 'රඳවා ගැනීමේ තත්වය (Hold) — පෙර අගය මතකයේ පවතී';
  else msg = '⚠️ තහනම් තත්වය (Forbidden State) — S=R=1 වලංගු නොවේ';
  document.getElementById('srStateMsg').textContent = msg;
}
function updateSRLogic(){
  const {S,R} = srState;
  if(S===1 && R===0){ srState.Q=1; srState.Qbar=0; }
  else if(S===0 && R===1){ srState.Q=0; srState.Qbar=1; }
  else if(S===0 && R===0){ /* hold previous */ }
  else { srState.Q = srState.Q; srState.Qbar = srState.Qbar; } // forbidden - display kept, marked invalid
}
renderSR();

/* =========================================================
   QUIZ ENGINE
========================================================= */
function buildQuiz(sectionId){
  const questions = QUIZ[sectionId];
  const host = document.getElementById('quizhost-'+sectionId);
  let idx = 0, score = 0;

  function renderQ(){
    if(idx >= questions.length){
      host.innerHTML = `
        <div class="quiz-card quiz-score">
          <div style="font-size:13px;color:var(--text-dim)">ඔබගේ ලකුණු</div>
          <div class="big-num">${score} / ${questions.length}</div>
          <button class="quiz-restart" onclick="restartQuiz_${sectionId}()">නැවත උත්සාහ කරන්න</button>
        </div>`;
      return;
    }
    const q = questions[idx];
    host.innerHTML = `
      <div class="quiz-card">
        <div class="quiz-progress">ප්‍රශ්නය ${idx+1} / ${questions.length}</div>
        <div class="quiz-q">${q.q}</div>
        <div id="optsWrap-${sectionId}"></div>
        <div class="quiz-explain" id="explain-${sectionId}">${q.exp}</div>
        <button class="quiz-nextbtn" id="nextbtn-${sectionId}" onclick="nextQuestion_${sectionId}()">${idx===questions.length-1? 'ප්‍රතිඵලය බලන්න →':'ඊළඟ ප්‍රශ්නය →'}</button>
      </div>`;
    const optsWrap = document.getElementById('optsWrap-'+sectionId);
    q.opts.forEach((opt,i)=>{
      const b = document.createElement('button');
      b.className = 'quiz-opt';
      b.textContent = opt;
      b.onclick = ()=>{
        const correct = i===q.ans;
        if(correct) score++;
        document.querySelectorAll('#optsWrap-'+sectionId+' .quiz-opt').forEach((el,j)=>{
          el.classList.add('disabled');
          if(j===q.ans) el.classList.add('correct');
          else if(j===i) el.classList.add('wrong');
        });
        document.getElementById('explain-'+sectionId).classList.add('show');
        document.getElementById('nextbtn-'+sectionId).classList.add('show');
      };
      optsWrap.appendChild(b);
    });
  }
  window['nextQuestion_'+sectionId] = function(){ idx++; renderQ(); };
  window['restartQuiz_'+sectionId] = function(){ idx=0; score=0; renderQ(); };
  renderQ();
}
Object.keys(QUIZ).forEach(buildQuiz);
</script>
