<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>කාබනික පරිවර්තන ගවේෂකය</title>
<style>
  :root{
    --bg-deep:#101b2d;
    --bg-panel:#16233a;
    --bg-card:#1c2d47;
    --line:#2c3f5e;
    --teal:#2fd6c0;
    --amber:#f4b942;
    --coral:#ef7d6b;
    --paper:#eef2f2;
    --text-dim:#9db1c9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% -10%, #1c3350 0%, transparent 45%),
      radial-gradient(circle at 100% 0%, #16324a 0%, transparent 40%),
      var(--bg-deep);
    color:var(--paper);
    font-family: "Iskoola Pota","Noto Sans Sinhala","Segoe UI",sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  .formula{font-family:"Consolas","Menlo","Courier New",monospace; letter-spacing:.3px;}
  sub{font-size:.72em;}
  sup{font-size:.68em;}

  header.top{
    position:sticky; top:0; z-index:50;
    background:linear-gradient(180deg, rgba(16,27,45,.98), rgba(16,27,45,.9));
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
    padding:14px 16px 10px;
  }
  .brand{
    display:flex; align-items:center; gap:10px; margin-bottom:12px;
  }
  .brand .dot{
    width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%, var(--teal), #0d6b5f);
    box-shadow:0 0 14px rgba(47,214,192,.7);
    flex-shrink:0;
  }
  .brand h1{
    font-size:1.15rem; margin:0; font-weight:700; letter-spacing:.2px;
  }
  .brand p{margin:2px 0 0; font-size:.72rem; color:var(--text-dim);}

  nav.tabs{
    display:flex; gap:8px; overflow-x:auto; scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    flex:1 0 auto;
    background:var(--bg-panel);
    border:1px solid var(--line);
    color:var(--paper);
    padding:11px 14px;
    border-radius:12px;
    font-size:.85rem;
    font-weight:600;
    white-space:nowrap;
    cursor:pointer;
    transition:.15s;
  }
  nav.tabs button.active{
    background:linear-gradient(135deg, var(--teal), #1a9c8a);
    color:#062420;
    border-color:transparent;
  }

  main{max-width:760px; margin:0 auto; padding:16px 14px 60px;}
  section.view{display:none; animation:fade .25s ease;}
  section.view.active{display:block;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  /* ---- EXPLORER ---- */
  .search-wrap{position:relative; margin-bottom:12px;}
  #searchBox{
    width:100%; padding:14px 44px 14px 16px; border-radius:14px;
    border:1px solid var(--line); background:var(--bg-panel); color:var(--paper);
    font-size:1rem;
  }
  #searchBox::placeholder{color:var(--text-dim);}
  .search-wrap svg{position:absolute; right:14px; top:50%; transform:translateY(-50%); opacity:.6;}

  .compound-grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:18px;
  }
  .compound-btn{
    background:var(--bg-card); border:1px solid var(--line); border-radius:14px;
    padding:12px 10px; text-align:center; cursor:pointer; color:var(--paper);
    transition:.15s;
  }
  .compound-btn small{display:block; color:var(--text-dim); font-size:.68rem; margin-bottom:4px;}
  .compound-btn .cf{font-size:.95rem;}
  .compound-btn.sel{border-color:var(--teal); box-shadow:0 0 0 2px rgba(47,214,192,.35);}
  .compound-btn:active{transform:scale(.97);}

  .central-card{
    background:linear-gradient(160deg, var(--bg-card), #16263f);
    border:1px solid var(--line);
    border-radius:18px;
    padding:20px 16px;
    text-align:center;
    margin-bottom:16px;
    position:relative;
    overflow:hidden;
  }
  .central-card::before{
    content:""; position:absolute; inset:0;
    background:radial-gradient(circle at 85% -20%, rgba(244,185,66,.18), transparent 55%);
  }
  .central-card .tag{
    display:inline-block; font-size:.68rem; padding:3px 10px; border-radius:20px;
    background:rgba(47,214,192,.14); color:var(--teal); margin-bottom:8px; font-weight:700;
  }
  .central-card h2{margin:4px 0 2px; font-size:1.3rem; position:relative;}
  .central-card p{margin:0; color:var(--text-dim); font-size:.85rem; position:relative;}

  .hint{color:var(--text-dim); font-size:.78rem; margin:6px 2px 10px; text-align:center;}

  .reagent-grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:10px;
  }
  .reagent-btn{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:14px;
    padding:13px 10px; cursor:pointer; color:var(--paper); text-align:center;
    font-size:.86rem; transition:.15s;
  }
  .reagent-btn:active{transform:scale(.96);}
  .reagent-btn.active{background:linear-gradient(135deg,var(--amber),#c98d1f); color:#2b1c00; border-color:transparent; font-weight:700;}

  .answer-panel{
    margin-top:16px; background:var(--bg-card); border:1px solid var(--teal); border-radius:16px;
    padding:16px; display:none;
  }
  .answer-panel.show{display:block; animation:fade .25s ease;}
  .answer-panel .row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px;}
  .arrow-tag{
    background:rgba(244,185,66,.15); color:var(--amber); padding:4px 10px; border-radius:8px; font-size:.78rem;
  }
  .answer-panel .product{font-size:1.05rem; margin:6px 0 10px;}
  .answer-panel .explain{
    background:rgba(47,214,192,.08); border-right:3px solid var(--teal);
    padding:10px 12px; border-radius:8px; font-size:.86rem; line-height:1.55; color:#d6e6e2;
  }

  /* ---- QUIZ ---- */
  .quiz-top{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;
  }
  .score-box{
    background:var(--bg-card); border:1px solid var(--line); border-radius:12px;
    padding:8px 14px; font-size:.85rem; font-weight:700; color:var(--teal);
  }
  .btn-primary{
    background:linear-gradient(135deg, var(--teal), #1a9c8a); color:#062420; border:none;
    padding:13px 20px; border-radius:14px; font-weight:700; font-size:.9rem; cursor:pointer;
    width:100%;
  }
  .btn-primary:active{transform:scale(.98);}
  .q-card{
    background:var(--bg-card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px;
  }
  .q-count{color:var(--text-dim); font-size:.75rem; margin-bottom:6px;}
  .q-text{font-size:1rem; line-height:1.6; margin-bottom:14px;}
  .q-text .formula{color:var(--amber);}
  .opt-btn{
    display:block; width:100%; text-align:right; background:var(--bg-panel);
    border:1px solid var(--line); color:var(--paper); padding:12px 14px; border-radius:12px;
    margin-bottom:9px; font-size:.9rem; cursor:pointer; transition:.15s;
  }
  .opt-btn:active{transform:scale(.98);}
  .opt-btn.correct{background:rgba(47,214,192,.18); border-color:var(--teal);}
  .opt-btn.wrong{background:rgba(239,125,107,.18); border-color:var(--coral);}
  .opt-btn.disabled{pointer-events:none; opacity:.75;}
  .feedback{
    margin-top:6px; padding:12px; border-radius:10px; font-size:.85rem; line-height:1.55; display:none;
  }
  .feedback.show{display:block; animation:fade .2s ease;}
  .feedback.ok{background:rgba(47,214,192,.1); border-right:3px solid var(--teal);}
  .feedback.no{background:rgba(239,125,107,.1); border-right:3px solid var(--coral);}
  .quiz-end{text-align:center; padding:30px 10px;}
  .quiz-end .big{font-size:2.4rem; font-weight:800; color:var(--amber);}

  /* ---- NOTES ---- */
  .cat-title{
    font-size:.85rem; color:var(--teal); font-weight:700; margin:18px 4px 8px; letter-spacing:.3px;
  }
  .cat-title:first-child{margin-top:2px;}
  .note-item{
    background:var(--bg-card); border:1px solid var(--line); border-radius:14px; padding:0; margin-bottom:8px; overflow:hidden;
  }
  .note-head{
    padding:13px 14px; display:flex; justify-content:space-between; align-items:center; cursor:pointer;
  }
  .note-head .rname{font-weight:700; color:var(--amber);}
  .note-head .chevron{transition:.2s; color:var(--text-dim);}
  .note-body{
    max-height:0; overflow:hidden; transition:max-height .25s ease;
    font-size:.85rem; line-height:1.6; color:#d6e2ef;
  }
  .note-body-inner{padding:0 14px 14px;}
  .note-item.open .note-body{max-height:200px;}
  .note-item.open .chevron{transform:rotate(180deg);}

  footer.space{height:20px;}

  @media (min-width:640px){
    .compound-grid{grid-template-columns:repeat(3,1fr);}
    .reagent-grid{grid-template-columns:repeat(3,1fr);}
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="dot"></div>
    <div>
      <h1>කාබනික පරිවර්තන ගවේෂකය</h1>
      <p>උසස් පෙළ රසායන විද්‍යාව — කාබනික පරිවර්තන අධ්‍යයන මෙවලම</p>
    </div>
  </div>
  <nav class="tabs">
    <button class="active" data-view="explorer">🧭 පරිවර්තන ගවේෂකය</button>
    <button data-view="quiz">📝 ප්‍රශ්නාවලිය</button>
    <button data-view="notes">📒 කෙටි සටහන්</button>
  </nav>
</header>

<main>

  <!-- EXPLORER -->
  <section class="view active" id="view-explorer">
    <div class="search-wrap">
      <input id="searchBox" type="text" placeholder="සංයෝගයක් සොයන්න (උදා: ඇනිලීන්, ඇල්කීන්, එස්ටර්...)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9db1c9" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </div>
    <div class="compound-grid" id="compoundGrid"></div>

    <div id="centralWrap"></div>
    <div id="reagentWrap"></div>
    <div class="answer-panel" id="answerPanel">
      <div class="row"><span class="arrow-tag" id="ansReagent"></span></div>
      <div class="product formula" id="ansProduct"></div>
      <div class="explain" id="ansExplain"></div>
    </div>
  </section>

  <!-- QUIZ -->
  <section class="view" id="view-quiz">
    <div class="quiz-top">
      <div class="score-box">ලකුණු: <span id="scoreVal">0</span> / <span id="scoreTotal">0</span></div>
      <div class="score-box" id="qProgress">0 / 10</div>
    </div>
    <div id="quizArea">
      <p style="color:var(--text-dim); font-size:.9rem; line-height:1.6; margin-bottom:16px;">
        රූප සටහන් 17 ම පදනම් කරගත් ප්‍රශ්න 10ක අහඹු ප්‍රශ්නාවලියක්. සෑම ප්‍රශ්නයකටම පසුව නිවැරදි පැහැදිලි කිරීම සිංහලෙන් පෙන්වයි.
      </p>
      <button class="btn-primary" id="startQuizBtn">ප්‍රශ්නාවලිය ආරම්භ කරන්න ▶</button>
    </div>
  </section>

  <!-- NOTES -->
  <section class="view" id="view-notes">
    <div id="notesArea"></div>
  </section>

  <footer class="space"></footer>
</main>

<script>
/* =========================================================
   DATA: 17 CONVERSION SHEETS
   ========================================================= */
const C = { // shorthand for html sub tags
  s:(n)=>`<sub>${n}</sub>`
};
const compounds = [
{
  id:"aniline", type:"aromatic", name:"ඇනිලීන් (Aniline)",
  formula:"C<sub>6</sub>H<sub>5</sub>-NH<sub>2</sub>",
  reactions:[
    {reagent:"dil. HCl", product:"C<sub>6</sub>H<sub>5</sub>-N<sup>+</sup>H<sub>3</sub> Cl<sup>-</sup>",
      explain:"ඇනිලීන් හි නයිට්‍රජන් පරමාණුවේ ඇති තනි ඉලෙක්ට්‍රෝන යුගලය H<sup>+</sup> අයනයක් සමඟ බැඳී ඇනිලීනියම් ක්ලෝරයිඩ් ලවණය සෑදේ (-NH<sub>2</sub> → -N<sup>+</sup>H<sub>3</sub>Cl<sup>-</sup>). මූලික ලක්ෂණය ක්ෂාරීයභාවයයි."},
    {reagent:"Br<sub>2</sub>(aq) / Br<sub>2</sub>+H<sub>2</sub>O", product:"2,4,6-ට්‍රයිබ්‍රෝමෝ ඇනිලීන් + 3HBr",
      explain:"-NH<sub>2</sub> කාණ්ඩය ප්‍රබල ක්‍රියාකාරී කාණ්ඩයක් නිසා (o,p-directing) වළය තුනට Br පරමාණු 3ක් එකවර ආදේශ වී සුදු අවක්ෂේපයක් සාදයි. Br<sub>2</sub> ජලය පාට නැති වීම මගින් හඳුනාගත හැක."},
    {reagent:"NaNO<sub>2</sub>/HCl (0-5°C)", product:"C<sub>6</sub>H<sub>5</sub>-N<sup>+</sup>≡NCl<sup>-</sup> (බෙන්සීන් ඩයසෝනියම් ක්ලෝරයිඩ්)",
      explain:"අඩු උෂ්ණත්වයේදී (0-5°C) -NH<sub>2</sub> කාණ්ඩය ඩයසෝටීකරණය වී ඩයසෝනියම් ලවණය සාදයි. උෂ්ණත්වය ඉහළ ගියහොත් ඩයසෝනියම් ලවණය අස්ථායී වේ."},
    {reagent:"NaNO<sub>2</sub>/HCl (රත් කිරීමේදී)", product:"C<sub>6</sub>H<sub>5</sub>-OH + N<sub>2</sub>↑",
      explain:"ඩයසෝනියම් ලවණය රත් කිරීමේදී ජලය සමඟ ප්‍රතික්‍රියා කර ෆීනෝල් සහ නයිට්‍රජන් වායුව නිදහස් කරයි (ජල විච්ඡේදනය)."},
    {reagent:"R-COCl (acyl chloride)", product:"C<sub>6</sub>H<sub>5</sub>-NH-CO-R + HCl",
      explain:"නයිට්‍රජන් හි තනි ඉලෙක්ට්‍රෝන යුගලය acyl chloride හි කාබනික කාබන් වෙත ප්‍රහාරය කර N-ආදේශිත ඇමයිඩයක් (ඇනිලයිඩ්) සාදයි."},
    {reagent:"R-CHO (dil. NaOH, condensation)", product:"R-CH=N-C<sub>6</sub>H<sub>5</sub> (Schiff base)",
      explain:"ඇල්ඩිහයිඩයේ කාබනික කාබන් හා ඇමයින් හි නයිට්‍රජන් අතර ජලාපනයන ප්‍රතික්‍රියාවක් සිදුවී H<sub>2</sub>O නිදහස් වී imine (Schiff base) සාදයි."},
    {reagent:"R-CO-R (ketone, condensation)", product:"R-C(=N-C<sub>6</sub>H<sub>5</sub>)-R",
      explain:"කීටෝනයේ කාබනික කාබන් හා ඇමයින් නයිට්‍රජන් අතර condensation මගින් H<sub>2</sub>O නිදහස් වී N-ආදේශිත imine එකක් සෑදේ."}
  ]
},
{
  id:"ketone", type:"aliphatic", name:"කීටෝන (Ketone)",
  formula:"CH<sub>3</sub>-CO-CH<sub>3</sub>",

/* =========================================================
   EXPLORER LOGIC
   ========================================================= */
let selectedCompound = null;
let selectedReactionIdx = null;

const grid = document.getElementById("compoundGrid");
const searchBox = document.getElementById("searchBox");

function renderCompoundGrid(filter=""){
  grid.innerHTML = "";
  const f = filter.trim().toLowerCase();
  compounds.forEach(c=>{
    const plain = c.name.toLowerCase();
    if(f && !plain.includes(f)) return;
    const btn = document.createElement("div");
    btn.className = "compound-btn" + (selectedCompound && selectedCompound.id===c.id ? " sel":"");
    btn.innerHTML = `<small>${c.type==='aromatic'?'ඇරෝමැටික':'ඇලිපැටික්'}</small><span class="cf formula">${c.name.split('(')[0]}</span>`;
    btn.onclick = ()=>selectCompound(c.id);
    grid.appendChild(btn);
  });
}

function selectCompound(id){
  selectedCompound = compounds.find(c=>c.id===id);
  selectedReactionIdx = null;
  renderCompoundGrid(searchBox.value);
  renderCentral();
  renderReagents();
  document.getElementById("answerPanel").classList.remove("show");
}

function renderCentral(){
  const wrap = document.getElementById("centralWrap");
  if(!selectedCompound){ wrap.innerHTML=""; return; }
  wrap.innerHTML = `
    <div class="central-card">
      <span class="tag">${selectedCompound.type==='aromatic'?'ඇරෝමැටික සංයෝගය':'ඇලිපැටික් සංයෝගය'}</span>
      <h2 class="formula">${selectedCompound.formula}</h2>
      <p>${selectedCompound.name}</p>
    </div>
    <div class="hint">👇 පහත ප්‍රතික්‍රියාකාරකයක් ඔබා පරිවර්තනය බලන්න</div>
  `;
}

function renderReagents(){
  const wrap = document.getElementById("reagentWrap");
  if(!selectedCompound){ wrap.innerHTML=""; return; }
  const gridHtml = selectedCompound.reactions.map((r,i)=>
    `<div class="reagent-btn formula${selectedReactionIdx===i?' active':''}" data-i="${i}">${r.reagent}</div>`
  ).join("");
  wrap.innerHTML = `<div class="reagent-grid">${gridHtml}</div>`;
  wrap.querySelectorAll(".reagent-btn").forEach(btn=>{
    btn.onclick = ()=>{
      selectedReactionIdx = parseInt(btn.dataset.i);
      renderReagents();
      showAnswer();
    };
  });
}

function showAnswer(){
  const r = selectedCompound.reactions[selectedReactionIdx];
  document.getElementById("ansReagent").innerHTML = "ප්‍රතික්‍රියාකාරකය: " + r.reagent;
  document.getElementById("ansProduct").innerHTML = "→ " + r.product;
  document.getElementById("ansExplain").innerHTML = r.explain;
  const panel = document.getElementById("answerPanel");
  panel.classList.add("show");
  panel.scrollIntoView({behavior:"smooth", block:"nearest"});
}

searchBox.addEventListener("input", ()=>renderCompoundGrid(searchBox.value));
renderCompoundGrid();

/* =========================================================
   QUIZ LOGIC
   ========================================================= */
// flatten all reactions with parent compound reference
const pool = [];
compounds.forEach(c=>{
  c.reactions.forEach(r=>{
    pool.push({compound:c, reagent:r.reagent, product:r.product, explain:r.explain});
  });
});

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

let quizQuestions = [];
let quizIdx = 0;
let score = 0;

function buildQuiz(){
  const shuffled = shuffle(pool);
  quizQuestions = shuffled.slice(0,10).map(item=>{
    const type = Math.random() < 0.5 ? "product" : "reagent";
    let correct, questionText, options;
    if(type === "product"){
      correct = item.product;
      questionText = `<span class="formula">${item.compound.formula}</span> සංයෝගයට <span class="formula">${item.reagent}</span> ප්‍රතික්‍රියාකාරකය දැමූ විට ලැබෙන ප්‍රධාන නිශ්පාදිතය කුමක්ද?`;
      const distractors = shuffle(pool.filter(p=>p.product!==correct)).slice(0,3).map(p=>p.product);
      options = shuffle([correct, ...distractors]);
    } else {
      correct = item.reagent;
      questionText = `<span class="formula">${item.compound.formula}</span> සංයෝගය <span class="formula">${item.product}</span> බවට පත් කිරීමට යෙදිය යුතු නිවැරදි ප්‍රතික්‍රියාකාරකය තෝරන්න.`;
      const distractors = shuffle(pool.filter(p=>p.reagent!==correct)).slice(0,3).map(p=>p.reagent);
      options = shuffle([correct, ...distractors]);
    }
    return {questionText, options, correct, explain:item.explain};
  });
  quizIdx = 0; score = 0;
  document.getElementById("scoreVal").textContent = "0";
  document.getElementById("scoreTotal").textContent = "10";
  renderQuizQuestion();
}

function renderQuizQuestion(){
  document.getElementById("qProgress").textContent = (quizIdx+1)+" / "+quizQuestions.length;
  const q = quizQuestions[quizIdx];
  const area = document.getElementById("quizArea");
  area.innerHTML = `
    <div class="q-card">
      <div class="q-count">ප්‍රශ්නය ${quizIdx+1}</div>
      <div class="q-text">${q.questionText}</div>
      <div id="optsWrap"></div>
      <div class="feedback" id="fb"></div>
    </div>
  `;
  const optsWrap = document.getElementById("optsWrap");
  q.options.forEach(opt=>{
    const b = document.createElement("div");
    b.className = "opt-btn formula";
    b.innerHTML = opt;
    b.onclick = ()=>answerQuiz(opt, b);
    optsWrap.appendChild(b);
  });
}

function answerQuiz(chosen, btnEl){
  const q = quizQuestions[quizIdx];
  const allBtns = document.querySelectorAll(".opt-btn");
  allBtns.forEach(b=>b.classList.add("disabled"));
  const isCorrect = chosen === q.correct;
  if(isCorrect){ score++; document.getElementById("scoreVal").textContent = score; btnEl.classList.add("correct"); }
  else {
    btnEl.classList.add("wrong");
    allBtns.forEach(b=>{ if(b.innerHTML===q.correct) b.classList.add("correct"); });
  }
  const fb = document.getElementById("fb");
  fb.className = "feedback show " + (isCorrect ? "ok":"no");
  fb.innerHTML = (isCorrect ? "✅ නිවැරදියි! " : "❌ වැරදියි. නිවැරදි පිළිතුර: <span class='formula'>"+q.correct+"</span><br>") + q.explain;

  const nextBtn = document.createElement("button");
  nextBtn.className = "btn-primary";
  nextBtn.style.marginTop = "14px";
  nextBtn.textContent = (quizIdx < quizQuestions.length-1) ? "ඊළඟ ප්‍රශ්නය ▶" : "ප්‍රතිඵලය බලන්න 🏁";
  nextBtn.onclick = ()=>{
    quizIdx++;
    if(quizIdx < quizQuestions.length) renderQuizQuestion();
    else renderQuizEnd();
  };
  document.querySelector(".q-card").appendChild(nextBtn);
}

function renderQuizEnd(){
  const area = document.getElementById("quizArea");
  const pct = Math.round((score/quizQuestions.length)*100);
  let msg = "හොඳින් උත්සාහ කරන්න!";
  if(pct>=80) msg = "විශිෂ්ටයි! ඔබ මාතෘකාව හොඳින් තේරුම් ගෙන ඇත 🎉";
  else if(pct>=50) msg = "හොඳයි! තව ටිකක් පුනරීක්ෂණය කරන්න.";
  area.innerHTML = `
    <div class="q-card quiz-end">
      <div class="big">${score} / ${quizQuestions.length}</div>
      <p style="color:var(--text-dim); margin:8px 0 18px;">${msg}</p>
      <button class="btn-primary" id="restartBtn">නැවත උත්සාහ කරන්න ↻</button>
    </div>
  `;
  document.getElementById("restartBtn").onclick = buildQuiz;
}

document.getElementById("startQuizBtn").onclick = buildQuiz;

/* =========================================================
   NOTES RENDER
   ========================================================= */
const notesArea = document.getElementById("notesArea");
notesData.forEach(cat=>{
  const title = document.createElement("div");
  title.className = "cat-title";
  title.textContent = cat.cat;
  notesArea.appendChild(title);
  cat.items.forEach(item=>{
    const box = document.createElement("div");
    box.className = "note-item";
    box.innerHTML = `
      <div class="note-head">
        <span class="rname formula">${item.n}</span>
        <span class="chevron">▾</span>
      </div>
      <div class="note-body"><div class="note-body-inner">${item.f}</div></div>
    `;
    box.querySelector(".note-head").onclick = ()=>{
      const isOpen = box.classList.contains("open");
      notesArea.querySelectorAll(".note-item.open").forEach(o=>o.classList.remove("open"));
      if(!isOpen) box.classList.add("open");
    };
    notesArea.appendChild(box);
  });
});
