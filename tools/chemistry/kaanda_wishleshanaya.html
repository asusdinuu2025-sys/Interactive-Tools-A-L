<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>කාණ්ඩ විශ්ලේෂණය - E-Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans Sinhala', sans-serif;
            background: linear-gradient(135deg, #030712 0%, #0b0f19 50%, #020408 100%);
            color: #f8fafc;
            min-height: 100vh;
        }

        /* Test Tube Setup */
        .stage-wrapper {
            position: relative;
            width: 100%;
            height: 320px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        /* Beaker elevated for burner */
        .beaker-glass {
            position: relative;
            width: 130px;
            height: 200px;
            background: linear-gradient(to right, rgba(255,255,255,0.15), rgba(255,255,255,0.03) 50%, rgba(255,255,255,0.18));
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-top: none;
            border-radius: 0 0 35px 35px;
            box-shadow: 0 0 25px rgba(0,0,0,0.8), inset 0 0 15px rgba(255,255,255,0.1);
            overflow: hidden;
            backdrop-filter: blur(2px);
            z-index: 15;
        }

        .liquid-fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 65%;
            transition: background-color 1.2s ease-in-out;
            border-radius: 0 0 32px 32px;
        }

        /* Exact Proportional Precipitate Layer */
        .ppt-layer {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 0%;
            transition: height 1.8s cubic-bezier(0.25, 1, 0.5, 1), background 1.2s ease;
            border-radius: 0 0 32px 32px;
            overflow: hidden;
        }

        /* Reagent Dropper */
        .dropper {
            position: absolute;
            top: -70px;
            left: 50%;
            transform: translateX(-50%);
            transition: all 1s ease-in-out;
            z-index: 30;
            opacity: 0;
        }
        .dropper.active { top: 5px; opacity: 1; }
        .drop {
            position: absolute;
            width: 8px; height: 14px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            left: 50%; transform: translateX(-50%); opacity: 0;
        }

        @keyframes dropFall {
            0% { top: 35px; opacity: 1; transform: translateX(-50%) scale(1); }
            70% { opacity: 1; }
            100% { top: 110px; opacity: 0; transform: translateX(-50%) scale(0.3); }
        }
        .animate-drop { animation: dropFall 1.4s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

        /* Burner UNDER Beaker */
        .burner-under-beaker {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; z-index: 5;
            transition: opacity 0.8s ease; opacity: 0;
        }
        .burner-under-beaker.visible { opacity: 1; }
        .heating-flame {
            width: 32px; height: 45px;
            background: radial-gradient(circle, rgba(59,130,246,0.95) 0%, rgba(239,68,68,0.8) 50%, transparent 100%);
            border-radius: 50% 50% 20% 20%; filter: blur(2px);
            animation: heatFlicker 0.1s infinite alternate ease-in-out;
            margin-bottom: -10px; z-index: 5;
        }
        @keyframes heatFlicker {
            0% { transform: scale(0.92) rotate(-1deg); }
            100% { transform: scale(1.08) rotate(1deg); }
        }
        .burner-tube { width: 16px; height: 55px; background: linear-gradient(to right, #475569, #94a3b8, #334155); border-radius: 3px 3px 0 0; z-index: 10; }

        /* Arrows Container */
        .arrow-labels-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
        .ppt-label {
            position: absolute; left: 50%; transform: translateX(75px);
            display: flex; align-items: center; gap: 6px; opacity: 0; transition: opacity 0.8s ease;
        }
        .ppt-label.visible { opacity: 1; }
        .ppt-label i {
            color: rgba(255,255,255,0.7); font-size: 14px; animation: pointLeft 1s infinite alternate ease-in-out;
        }
        @keyframes pointLeft { 0% { transform: translateX(0); } 100% { transform: translateX(-4px); } }

        /* Flame Test Stage */
        .flame-test-stage {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: flex-end; z-index: 30; opacity: 0;
            pointer-events: none; transition: opacity 1s ease-in-out;
        }
        .flame-test-stage.active { opacity: 1; pointer-events: auto; }
        .flame-container-main { position: relative; width: 120px; height: 180px; display: flex; justify-content: center; align-items: flex-end; margin-bottom: 75px; }
        .flame-layer { position: absolute; bottom: 0; border-radius: 50% 50% 35% 35% / 60% 60% 40% 40%; transform-origin: center bottom; transition: all 1.2s ease-in-out; filter: blur(2px); }
        .flame-aura { width: 120px; height: 180px; opacity: 0.4; filter: blur(20px); border-radius: 50%; }
        .flame-outer { width: 65px; height: 145px; opacity: 0.88; animation: flameFlicker 0.15s infinite alternate ease-in-out; }
        .flame-inner { width: 35px; height: 95px; opacity: 0.95; animation: flameFlicker 0.12s infinite alternate ease-in-out 0.05s; }
        
        .wire-holder-flame { position: absolute; right: -140px; bottom: 125px; width: 220px; height: 6px; transition: transform 1.5s cubic-bezier(0.65, 0, 0.35, 1); z-index: 25; }
        .wire-rod-flame { width: 140px; height: 3px; background: linear-gradient(to right, #475569, #cbd5e1); }
        .wire-loop-flame { width: 12px; height: 12px; border: 2px solid #cbd5e1; border-radius: 50%; margin-left: -2px; box-shadow: 0 0 5px rgba(255,255,255,0.8); }
        .wire-in-flame-active { transform: translateX(-125px); }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 3px; }
    </style>
</head>

    <script>
        // Mathematically adjusted Solid Gradients based on exact cation count
        // Group 2: Total 9 (Black 4 [45%], Brown 1 [10%], Orange 1 [10%], Yellow 3 [35%])

                theory: 'HCl හමුවේ H₂S හි වියෝජනය අඩුවන අතර Ksp ඉතා අඩු 2 කාණ්ඩයේ ලෝහ සල්ෆයිඩ පමණක් අවක්ෂේප වේ.',

                labels: [

                    { text: 'Fe(OH)₃ (රතු-දුඹුරු)', bottom: '8%', color: 'text-white bg-red-900' }
                ]
            },
            {
                id: 4, title: '4 කාණ්ඩය (Group 4)', reagent: 'NH₄OH + H₂S',
                solutionBg: 'rgba(168, 85, 247, 0.2)', pptBg: solidGroup4, pptHeight: '45%',
                pptText: 'CoS, NiS (කළු) | ZnS (සුදු) | MnS (රෝස)',
                theory: 'භාස්මික මාධ්‍යයේදී [S²-] සාන්ද්‍රණය වැඩි වන බැවින් Ksp සාපේක්ෂව වැඩි 4 කාණ්ඩයේ සල්ෆයිඩ අවක්ෂේප වේ.',
                tip: 'කළු සල්ෆයිඩ 2ක් ඇති බැවින් එය වැඩි ප්‍රතිශතයක් ගනී.',
                isHeating: false, isFlameTest: false,
                labels: [
                    { text: 'MnS (රෝස)', bottom: '39%', color: 'text-pink-900 bg-pink-300' },
                    { text: 'ZnS (සුදු)', bottom: '28%', color: 'text-slate-800 bg-white' },
                    { text: 'CoS, NiS (කළු)', bottom: '11%', color: 'text-white bg-slate-900 border border-slate-700' }
                ]
            },
            {
                id: 5, title: '5 කාණ්ඩය (Group 5)', reagent: '(NH₄)₂CO₃',
                solutionBg: 'rgba(244, 63, 94, 0.2)', pptBg: '#f8fafc', pptHeight: '26%',
                pptText: 'CaCO₃, SrCO₃, BaCO₃ (සුදු)',
                theory: 'ඇල්කලයින් පෘථිවි ලෝහ කාබනේට ලෙස සුදු පැහැයෙන් අවක්ෂේප වී වෙන් වේ.',
                tip: 'පෙරහනේ අවසාන කැටායන (Mg²⁺, Li⁺, Na⁺, K⁺) ඉතිරි වේ.',
                isHeating: false, isFlameTest: false,
                labels: [ { text: 'Ca, Sr, Ba කාබනේට', bottom: '24%', color: 'text-slate-800 bg-white' } ]
            },
            {
                id: 6, title: 'Mg²⁺ තහවුරු කිරීම', reagent: '8-හයිඩ්‍රොක්සික්විනෝලීන්',
                solutionBg: 'rgba(16, 185, 129, 0.25)', pptBg: '#84cc16', pptHeight: '30%',
                pptText: 'Mg-ඔක්සිනේට් (කහ-කොළ)',
                theory: 'භාස්මික මාධ්‍යයේදී Mg²⁺ අයන සමඟ කහ-කොළ පැහැති සංකීර්ණ අවක්ෂේපයක් සාදයි.',
                tip: 'Mg²⁺ අයන සාර්ථකව තහවුරු විය.',
                isHeating: false, isFlameTest: false,
                labels: [ { text: 'Mg-ඔක්සිනේට් (කහ-කොළ)', bottom: '28%', color: 'text-lime-900 bg-lime-400' } ]
            },
            {
                id: 7, title: '7. පහන් සිළු පරීක්ෂාව', reagent: 'සාන්ද්‍ර HCl + Pt කම්බිය',
                solutionBg: '', pptBg: '', pptHeight: '0%', pptText: 'Li⁺, Na⁺, K⁺',
                theory: 'අවසාන වශයෙන් ඉතිරිවන ක්ෂාර ලෝහ කැටායනවල ක්ලෝරයිඩ දැල්ලට අල්ලා ලාක්ෂණික වර්ණ නිරීක්ෂණය කරයි.',
                tip: 'කැටායන විශ්ලේෂණ පරීක්ෂණ මාලාව සාර්ථකව අවසන්!',
                isHeating: false, isFlameTest: true, labels: []
            }
        ];

        const flameData = {
            'Li': { name: 'Li⁺', colorText: 'රතු', outer: 'linear-gradient(to top, #dc2626, #ef4444, #f87171)', inner: 'linear-gradient(to top, #b91c1c, #fca5a5, #ffffff)', aura: 'rgba(239, 68, 68, 0.65)', bead: '#ef4444' },
            'Na': { name: 'Na⁺', colorText: 'තීව්‍ර කහ', outer: 'linear-gradient(to top, #d97706, #f59e0b, #fbbf24)', inner: 'linear-gradient(to top, #b45309, #fde68a, #ffffff)', aura: 'rgba(245, 158, 11, 0.75)', bead: '#f59e0b' },
            'K': { name: 'K⁺', colorText: 'ලයිලැක් / දම්', outer: 'linear-gradient(to top, #7e22ce, #a855f7, #c084fc)', inner: 'linear-gradient(to top, #6b21a8, #e9d5ff, #ffffff)', aura: 'rgba(168, 85, 247, 0.65)', bead: '#c084fc' }
        };

        let currentStepIdx = 0;
        let activeFlameCation = 'Li';

        function renderStepList() {
            const container = document.getElementById('stepContainer');
            container.innerHTML = '';
            steps.forEach((s, idx) => {
                const btn = document.createElement('button');
                btn.onclick = () => setStep(idx);
                btn.className = `w-full text-left p-2.5 rounded-xl border transition duration-300 flex items-center justify-between cursor-pointer ${idx === currentStepIdx ? 'bg-blue-600/30 border-blue-400 text-white shadow-md' : 'bg-slate-800/40 border-slate-700/60 text-slate-400 hover:bg-slate-800/80 hover:text-slate-200'}`;
                btn.innerHTML = `<div class="flex items-center gap-2.5"><span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${idx === currentStepIdx ? 'bg-blue-500 text-white' : 'bg-slate-700 text-slate-300'}">${s.id}</span><span class="text-xs font-semibold">${s.title}</span></div><i class="fa-solid fa-chevron-right text-[10px] opacity-60"></i>`;
                container.appendChild(btn);
            });
        }

        function setStep(idx) {
            currentStepIdx = idx;
            const data = steps[idx];

            document.getElementById('stepCounter').innerText = `${data.id}/${steps.length}`;
            document.getElementById('reagentBadge').innerText = `Reagent: ${data.reagent}`;
            document.getElementById('phaseBadge').innerText = `Phase ${data.id}: ${data.title.split(' ')[0]}`;

            const beakerApparatus = document.getElementById('beakerApparatus');
            const flameTestStage = document.getElementById('flameTestStage');
            const dropper = document.getElementById('dropper');
            const drop = document.getElementById('drop');
            const liquidFill = document.getElementById('liquidFill');
            const pptLayer = document.getElementById('pptLayer');
            const burnerHardware = document.getElementById('burnerHardware');
            const labelsContainer = document.getElementById('arrowLabelsContainer');
            const visualStatus = document.getElementById('visualStatus');

            if (data.isFlameTest) {
                beakerApparatus.style.display = 'none';
                flameTestStage.classList.add('active');
                switchFlameCation(activeFlameCation);
            } else {
                flameTestStage.classList.remove('active');
                beakerApparatus.style.display = 'flex';

                liquidFill.style.backgroundColor = data.solutionBg;
                pptLayer.style.height = '0%';
                pptLayer.style.background = data.pptBg;
                labelsContainer.innerHTML = ''; 

                if (data.isHeating) burnerHardware.classList.add('visible');
                else burnerHardware.classList.remove('visible');

                dropper.classList.add('active');
                drop.classList.add('animate-drop');
                visualStatus.innerText = `ප්‍රතිකාරකය එකතු කරමින්...`;

                setTimeout(() => {
                    pptLayer.style.height = data.pptHeight;
                    visualStatus.innerText = `නිරීක්ෂණය: ${data.pptText}`;
                    
                    data.labels.forEach((lbl, i) => {
                        const el = document.createElement('div');
                        el.className = 'ppt-label';
                        el.style.bottom = lbl.bottom;
                        el.innerHTML = `<i class="fa-solid fa-arrow-left text-slate-300 drop-shadow-md"></i><span class="ml-1.5 px-2 py-0.5 rounded shadow-lg text-[10px] font-semibold whitespace-nowrap border border-slate-500/50 ${lbl.color}">${lbl.text}</span>`;
                        labelsContainer.appendChild(el);
                        setTimeout(() => el.classList.add('visible'), i * 300 + 400);
                    });
                }, 1000);

                setTimeout(() => { dropper.classList.remove('active'); drop.classList.remove('animate-drop'); }, 2400);
            }

            document.getElementById('infoReagent').innerText = data.reagent;
            document.getElementById('infoPpt').innerText = data.pptText;
            document.getElementById('infoTheory').innerText = data.theory;
            document.getElementById('infoTip').innerHTML = `<i class="fa-solid fa-lightbulb text-amber-400 mr-1"></i> ${data.tip}`;
            document.getElementById('btnPrev').disabled = currentStepIdx === 0;
            document.getElementById('btnNext').disabled = currentStepIdx === steps.length - 1;
            renderStepList();
        }

        function switchFlameCation(key) {
            activeFlameCation = key;
            const fdata = flameData[key];
            ['Li', 'Na', 'K'].forEach(k => {
                const b = document.getElementById(`fbtn-${k}`);
                if (b) b.className = k === key ? 'px-2.5 py-1 rounded-lg text-xs font-bold bg-amber-500/30 border border-amber-400 text-white shadow' : 'px-2.5 py-1 rounded-lg text-xs font-bold bg-slate-800 border border-slate-700 text-slate-300';
            });
            const flameWireHolder = document.getElementById('flameWireHolder');
            flameWireHolder.classList.remove('wire-in-flame-active');
            
            setTimeout(() => flameWireHolder.classList.add('wire-in-flame-active'), 100);
            setTimeout(() => {
                document.getElementById('flameOuter').style.background = fdata.outer;
                document.getElementById('flameInner').style.background = fdata.inner;
                document.getElementById('flameAura').style.backgroundColor = fdata.aura;
                document.getElementById('flameWireLoop').style.backgroundColor = fdata.bead;
                document.getElementById('visualStatus').innerText = `පහන් සිළු පරීක්ෂාව: ${fdata.name} -> ${fdata.colorText}`;
            }, 1000);
        }

        function navigateStep(direction) {
            const nextIdx = currentStepIdx + direction;
            if (nextIdx >= 0 && nextIdx < steps.length) setStep(nextIdx);
        }

        window.onload = () => setStep(0);
    </script>
</body>
</html>
