[build]
  command = "node scripts/generate-admin-config.mjs && node scripts/generate-sitemap.mjs && node scripts/generate-search-index.mjs && node scripts/sync-page-boot.mjs && node scripts/sync-brand-icons.mjs && node scripts/bundle-styles.mjs"
  publish = "."
  ignore = "bash ./scripts/netlify-ignore.sh"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Admin preview code should never be served from a stale browser cache.
# These headers do not change public-facing pages or announcements.
[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/studylab-admin*.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0, must-revalidate"

# The admin mode controls live vs local publishing. Never cache an old value.
[[headers]]
  for = "/assets/js/studylab-admin-config.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/css/studylab-admin.css"
  [headers.values]
    Cache-Control = "no-store, max-age=0, must-revalidate"

# Content-addressed bundles change URL with every CSS edit.
[[headers]]
  for = "/assets/css/sl-bundle-*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
