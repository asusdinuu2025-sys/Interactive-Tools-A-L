<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a2b">
  <title>StudyLab Mini Timer</title>
  <style>
    *{box-sizing:border-box}
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:14px;background:radial-gradient(circle at 15% 0%,rgba(45,115,150,.2),transparent 48%),#0c1422;color:#edf5ff}
    .mini{width:100%;max-width:420px;padding:17px;border:1px solid rgba(126,220,255,.2);border-radius:19px;background:rgba(20,34,54,.96);box-shadow:0 18px 48px rgba(0,0,0,.3)}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;font-weight:850}
    header button{width:28px;height:28px;border:0;border-radius:9px;background:rgba(120,135,160,.15);color:inherit;font-size:19px;cursor:pointer}
    #clock{text-align:center;margin:13px 0 3px;font-size:clamp(2.1rem,10vw,2.8rem);font-weight:900;letter-spacing:.025em;font-variant-numeric:tabular-nums}
    #status{text-align:center;min-height:18px;color:#9aabc3;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}
    .actions button{min-height:39px;border:1px solid rgba(126,220,255,.2);border-radius:10px;background:rgba(126,220,255,.08);color:inherit;font:inherit;font-size:12px;font-weight:850;cursor:pointer}
    .actions button:first-child{background:linear-gradient(135deg,#26b98d,#168b78);border-color:transparent;color:white}
    .actions button:disabled{opacity:.35;cursor:not-allowed}
    .hint{margin:11px 0 0;text-align:center;color:#8092ac;font-size:10px;line-height:1.5}
    body.light{color-scheme:light;background:#edf2f8;color:#17233b}
    body.light .mini{background:rgba(255,255,255,.97);border-color:rgba(60,90,130,.18)}
    body.light #status,body.light .hint{color:#68758b}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main class="mini" aria-label="Independent StudyLab timer">
    <header><strong>StudyLab · Live Study Timer</strong><button id="close" type="button" aria-label="Close mini timer">×</button></header>
    <div id="clock" role="timer">00:00:00</div>
    <div id="status" role="status" aria-live="polite">Connecting to your Study Room…</div>
    <div class="actions">
      <button id="start" type="button" disabled>Start</button>
      <button id="pause" type="button" disabled>Pause</button>
      <button id="end" type="button" disabled>End</button>
    </div>
    <p class="hint">This independent window can stay open after you close the main Study Room tab.</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/studylab-account.js"></script>
  <script src="assets/js/study-room-config.js"></script>
  <script src="assets/js/study-room-mini-standalone.js?v=20261102-close-aware-v3"></script>
</body>
</html>
