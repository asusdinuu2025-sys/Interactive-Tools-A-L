name: StudyLab release checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

jobs:
  static-release-checks:
    name: Static release checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run release checks
        run: node scripts/release-check.mjs
