<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Quiet science line art at the edges">
<g fill="none" stroke="#B5CFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".19">
  <!-- Atomic orbits: upper left -->
  <g transform="translate(137 161) rotate(-12)">
    <ellipse rx="47" ry="16"/><ellipse rx="47" ry="16" transform="rotate(60)"/><ellipse rx="47" ry="16" transform="rotate(120)"/>
    <circle r="3.5" fill="#B5CFFF" stroke="none"/>
  </g>
  <!-- Parabolic and sinusoidal curves against left edge -->
  <path d="M-32 366 Q60 283 147 367 T320 367" stroke-width="1.75"/>
  <path d="M-18 400 H265 M89 306 V488" opacity=".44" stroke-dasharray="4 10"/>
  <path d="M-18 536 C78 465 194 485 253 548" opacity=".65"/>
  <!-- Molecule bottom left -->
  <g transform="translate(145 881) rotate(-11)">
    <path d="M-46 -5 L0 -32 L46 -5 L46 47 L0 75 L-46 47Z"/>
    <path d="M-46 -5 L0 23 L46 -5 M0 -32 V23 M0 23 V75"/>
    <circle cx="-46" cy="-5" r="5"/><circle cx="0" cy="-32" r="5"/><circle cx="46" cy="-5" r="5"/>
  </g>
  <!-- Right-side geometries -->
  <g transform="translate(1780 143) rotate(8)">
    <path d="M-48 38 L0 -45 L50 38Z M0 -45 V38 M-13 15 H15"/>
    <path d="M-37 24 Q-30 10 -17 9" stroke-dasharray="3 6"/>
  </g>
  <!-- Chemistry glassware -->
  <g transform="translate(1790 482) rotate(9)">
    <path d="M-15 -49 H15 M-9 -49 V-11 L-40 41 Q-44 51 -31 51 H31 Q44 51 40 41 L9 -11 V-49"/>
    <path d="M-32 24 Q0 14 32 24 M-20 32 H20"/>
    <circle cx="-6" cy="27" r="3"/><circle cx="14" cy="35" r="2"/>
  </g>
  <!-- Open textbook lower right -->
  <g transform="translate(1710 897) rotate(-7)">
    <path d="M-66 -26 Q-26 -39 0 -17 Q26 -39 66 -26 V42 Q26 28 0 50 Q-26 28 -66 42Z"/>
    <path d="M0 -17 V50 M-50 -12 Q-29 -20 -12 -9 M11 -9 Q31 -20 51 -12 M-50 3 Q-29 -6 -12 5 M11 5 Q31 -6 51 3"/>
  </g>
  <!-- Small, very faint edge constellations -->
  <path d="M45 667 L112 618 L181 655" stroke-dasharray="3 11"/>
  <circle cx="45" cy="667" r="3"/><circle cx="112" cy="618" r="3"/><circle cx="181" cy="655" r="3"/>
  <path d="M1790 670 C1845 638 1874 644 1925 695" stroke-dasharray="4 12"/>
  <path d="M1750 291 l12 0 m-6 -6 v12 M120 1033 l12 0 m-6 -6 v12"/>
</g>
<g font-family="Georgia, 'Times New Roman', serif" font-style="italic" fill="#B5CFFF" opacity=".17">
  <text x="251" y="94" font-size="30" transform="rotate(-10 251 94)">π</text>
  <text x="64" y="747" font-size="24" transform="rotate(7 64 747)">λ</text>
  <text x="1735" y="338" font-size="22" transform="rotate(-7 1735 338)">E = mc²</text>
  <text x="1755" y="1010" font-size="24" transform="rotate(4 1755 1010)">∑</text>
</g>
</svg>