<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="StudyLab Midnight Aurora atmospheric background">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080F22"/>
      <stop offset=".52" stop-color="#101A39"/>
      <stop offset="1" stop-color="#0B1831"/>
    </linearGradient>
    <radialGradient id="blueGlow"><stop stop-color="#23B7E5" stop-opacity=".31"/><stop offset=".55" stop-color="#348BF7" stop-opacity=".13"/><stop offset="1" stop-color="#23B7E5" stop-opacity="0"/></radialGradient>
    <radialGradient id="violetGlow"><stop stop-color="#9473E8" stop-opacity=".29"/><stop offset=".6" stop-color="#D295F1" stop-opacity=".10"/><stop offset="1" stop-color="#9473E8" stop-opacity="0"/></radialGradient>
    <radialGradient id="quiet"><stop stop-color="#0B1429" stop-opacity=".73"/><stop offset=".55" stop-color="#0B1429" stop-opacity=".35"/><stop offset="1" stop-color="#0B1429" stop-opacity="0"/></radialGradient>
    <linearGradient id="auroraC" x1=".05" y1=".9" x2=".95" y2=".08">
      <stop stop-color="#23B7E5" stop-opacity=".06"/>
      <stop offset=".38" stop-color="#348BF7" stop-opacity=".60"/>
      <stop offset=".69" stop-color="#23B7E5" stop-opacity=".55"/>
      <stop offset="1" stop-color="#23B7E5" stop-opacity=".03"/>
    </linearGradient>
    <linearGradient id="auroraV" x1=".15" y1=".05" x2=".9" y2="1">
      <stop stop-color="#9473E8" stop-opacity=".03"/>
      <stop offset=".48" stop-color="#9473E8" stop-opacity=".50"/>
      <stop offset=".77" stop-color="#D295F1" stop-opacity=".42"/>
      <stop offset="1" stop-color="#D295F1" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="edgeC" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#B8D9FF" stop-opacity="0"/>
      <stop offset=".48" stop-color="#B8D9FF" stop-opacity=".32"/>
      <stop offset="1" stop-color="#B8D9FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="blurSoft" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#ground)"/>
  <!-- Soft illumination lives near the outside; the middle stays calm under cards. -->
  <ellipse cx="1690" cy="115" rx="600" ry="465" fill="url(#blueGlow)"/>
  <ellipse cx="35" cy="905" rx="705" ry="550" fill="url(#violetGlow)"/>
  <ellipse cx="160" cy="105" rx="450" ry="420" fill="url(#blueGlow)" opacity=".4"/>
  <ellipse cx="1790" cy="965" rx="380" ry="360" fill="url(#violetGlow)" opacity=".48"/>
  <g filter="url(#blurSoft)">
    <path d="M1365 -230 C1360 70 1455 185 1645 326 C1788 432 1930 482 2160 519 L2150 -220Z" fill="url(#auroraC)" opacity=".48"/>
    <path d="M1720 -225 C1525 31 1523 211 1706 385 C1840 507 1966 543 2150 618 L2140 -225Z" fill="url(#auroraV)" opacity=".39"/>
    <path d="M-260 440 C15 492 151 641 323 767 C499 896 665 922 788 1205 L-260 1215Z" fill="url(#auroraC)" opacity=".48"/>
    <path d="M-270 655 C75 723 186 869 372 1017 C480 1104 599 1158 749 1240 L-270 1240Z" fill="url(#auroraV)" opacity=".28"/>
  </g>
  <!-- Thin luminous glass edges, not high-contrast stripes. -->
  <g fill="none" stroke-linecap="round">
    <path d="M1390 -110 C1399 100 1500 246 1656 352 C1834 474 1960 502 2120 538" stroke="url(#edgeC)" stroke-width="9" opacity=".23"/>
    <path d="M1441 -98 C1478 82 1531 204 1681 329 C1798 428 1926 474 2070 505" stroke="#B8D9FF" stroke-opacity=".13" stroke-width="1.65"/>
    <path d="M-170 605 C120 646 197 820 393 903 C533 965 676 1014 762 1168" stroke="url(#edgeC)" stroke-width="8" opacity=".23"/>
    <path d="M-145 645 C111 689 213 836 391 923 C537 997 623 1042 712 1200" stroke="#B8D9FF" stroke-opacity=".12" stroke-width="1.4"/>
  </g>
  <!-- Feather the centre so long text areas remain visually quiet. -->
  <ellipse cx="935" cy="480" rx="715" ry="575" fill="url(#quiet)" opacity=".77"/>
</svg>